<style>
/* ============ ТЕМА: ЧЁРНЫЙ / БЕЛЫЙ / СЕРЫЙ / ГРАФИТ ============ */
:root{
  --r-s:6px; --r-m:10px; --r-l:14px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
:root[data-theme="dark"]{
  --bg:#0d0e10; --bg-2:#121416; --panel:#171a1c; --panel-2:#1d2023; --panel-3:#24282c;
  --line:#2b3035; --line-2:#3a4046;
  --text:#e8eaec; --text-2:#a9afb5; --muted:#6f767d;
  --solid:#f0f1f2; --solid-text:#0f1112;
  --danger:#c9c9c9; --danger-bg:#2a1e1e;
  --shadow:0 20px 60px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.4);
  --grain: rgba(255,255,255,.03);
}
:root[data-theme="light"]{
  --bg:#e9ebed; --bg-2:#f2f3f5; --panel:#fbfbfc; --panel-2:#f1f2f4; --panel-3:#e5e7ea;
  --line:#d7dade; --line-2:#c2c7cc;
  --text:#171a1c; --text-2:#4b5157; --muted:#7d848b;
  --solid:#1a1d1f; --solid-text:#f6f7f8;
  --danger:#7a2222; --danger-bg:#f6e7e7;
  --shadow:0 20px 60px rgba(24,29,34,.22), 0 2px 8px rgba(24,29,34,.10);
  --grain: rgba(0,0,0,.025);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--font); background:var(--bg); color:var(--text);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
input,textarea{background:none;border:0}
input:focus,textarea:focus{outline:none}
::selection{background:var(--line-2);color:var(--text)}
/* скроллбары */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--line);border-radius:20px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:var(--line-2);background-clip:padding-box}

/* ============ КАРКАС ============ */
.app{display:flex;height:100%;min-height:0}
.sidebar{
  width:264px;flex:0 0 264px;background:var(--bg-2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;transition:margin-left .22s ease;
}
.brand{
  display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid var(--line);
}
.brand-mark{

.brand-name{font-weight:700;letter-spacing:.16em;font-size:12px;text-transform:uppercase}
.brand-sub{font-size:10.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.side-scroll{flex:1;overflow:auto;padding:12px 10px 18px}
.side-title{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 8px 8px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
}
.board-item{
  display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:var(--r-m);
  color:var(--text-2);text-align:left;position:relative;
}
.board-item:hover{background:var(--panel-2);color:var(--text)}
.board-item.active{background:var(--panel-3);color:var(--text);box-shadow:inset 2px 0 0 var(--solid)}
.board-item .bi-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.board-item .bi-count{
  font-size:10.5px;font-family:var(--mono);color:var(--muted);background:var(--panel-2);
  border:1px solid var(--line);border-radius:20px;padding:0 6px;min-width:20px;text-align:center;
}
.board-item .bi-del{opacity:0;font-size:13px;color:var(--muted);padding:2px 4px;border-radius:4px}
.board-item:hover .bi-del{opacity:1}
.board-item .bi-del:hover{color:var(--text);background:var(--line)}
.side-foot{border-top:1px solid var(--line);padding:10px;display:flex;gap:6px;flex-wrap:wrap}

/* главная область */
.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.topbar{
  display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);
  background:var(--bg-2);flex:0 0 auto;min-height:56px;
}
.icon-btn.hamb{display:none}
.icon-btn.hamb{position:relative;z-index:75}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:65;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
@media (min-width:901px){.scrim{display:none}}
.board-name{
  font-size:16px;font-weight:650;letter-spacing:-.01em;padding:6px 8px;border-radius:var(--r-s);
  min-width:60px;max-width:340px;flex:0 1 auto;border:1px solid transparent;
}
.board-name:hover{border-color:var(--line)}
.board-name:focus{border-color:var(--line-2);background:var(--panel)}
.top-spacer{flex:1}
.search{
  display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r-m);padding:0 10px;height:34px;width:220px;color:var(--muted);
}
.search:focus-within{border-color:var(--line-2);color:var(--text-2)}
.search input{flex:1;min-width:0;color:var(--text);font-size:13px}
.search svg{flex:0 0 auto}

/* кнопки */
.btn{
  display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:var(--r-m);
  background:var(--panel);border:1px solid var(--line);color:var(--text-2);font-size:13px;font-weight:500;
  white-space:nowrap;transition:background .12s,border-color .12s,color .12s;
}
.btn:hover{background:var(--panel-2);color:var(--text);border-color:var(--line-2)}
.btn.solid{background:var(--solid);color:var(--solid-text);border-color:var(--solid)}
.btn.solid:hover{opacity:.88;color:var(--solid-text)}
.btn.danger:hover{background:var(--danger-bg);color:var(--danger);border-color:var(--danger)}
.btn.sm{height:28px;padding:0 9px;font-size:12px;border-radius:var(--r-s)}
.icon-btn{
  display:grid;place-items:center;width:30px;height:30px;border-radius:var(--r-s);color:var(--muted);
}
.icon-btn:hover{background:var(--panel-3);color:var(--text)}
.icon-btn.sm{width:24px;height:24px;font-size:13px}

/* доска */
.board{
  flex:1;min-height:0;overflow:auto;padding:18px;
  background-image:radial-gradient(var(--grain) 1px, transparent 1px);
  background-size:22px 22px;
}
.lists{display:flex;align-items:flex-start;gap:14px;min-height:100%;padding-bottom:20px}
.list{
  flex:0 0 300px;width:300px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r-l);display:flex;flex-direction:column;max-height:calc(100vh - 130px);
  box-shadow:0 1px 0 rgba(255,255,255,.02) inset;
}
.list.drag-over{border-color:var(--line-2);background:var(--panel-2)}
.list.dragging{opacity:.45}
.list.drag-off{display:none !important}
.list-head{display:flex;align-items:center;gap:6px;padding:10px 8px 8px 12px;flex:0 0 auto}
.drag-handle{color:var(--muted);cursor:grab;letter-spacing:1px;font-size:12px;user-select:none;padding:0 2px}
.drag-handle:active{cursor:grabbing}
.list-title{
  flex:1;min-width:0;font-weight:600;font-size:13px;padding:3px 5px;border-radius:5px;
  border:1px solid transparent;text-overflow:ellipsis;
}
.list-title:hover{border-color:var(--line)}
.list-title:focus{border-color:var(--line-2);background:var(--panel-2)}
.list-count{font-size:11px;font-family:var(--mono);color:var(--muted)}
.cards{overflow:auto;padding:2px 8px 4px;display:flex;flex-direction:column;gap:8px;min-height:8px}
.cards:empty::after{
  content:"Перетащите задачу сюда";display:block;text-align:center;font-size:11.5px;color:var(--muted);
  border:1px dashed var(--line);border-radius:var(--r-m);padding:14px 8px;
}
.card{
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-m);padding:9px 10px;
  cursor:pointer;position:relative;transition:border-color .12s,background .12s,transform .06s;
}
.card:hover{border-color:var(--line-2);background:var(--panel-3)}
.card:active{transform:scale(.995)}
.card.dragging{opacity:.4}
.card.drag-off{display:none !important}
.drag-ghost{position:fixed;z-index:200;pointer-events:none;opacity:.95;box-shadow:var(--shadow);transform:rotate(1.2deg);border-radius:var(--r-m)}
.drag-ghost.card{background:var(--panel-3);border:1px solid var(--line-2);max-height:none}
.drag-ghost.list{max-height:320px;overflow:hidden;background:var(--panel);border:1px solid var(--line-2)}
body.is-dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
body.is-dragging .card{cursor:grabbing}
.drag-handle{touch-action:none}
.card-placeholder{border:1px dashed var(--line-2);border-radius:var(--r-m);min-height:44px;background:var(--panel-2);flex:0 0 auto}
.list-placeholder{border:1px dashed var(--line-2);border-radius:var(--r-l);width:300px;flex:0 0 300px;height:120px;background:rgba(255,255,255,.02)}
.card.done .card-title{color:var(--muted);text-decoration:line-through}
.card.done{background:var(--panel)}
.card-title{font-size:13px;font-weight:500;overflow-wrap:anywhere}
.card-top{display:flex;align-items:flex-start;gap:8px}
.card-top .check{margin-top:2px}
.card-foot{display:flex;align-items:center;gap:9px;margin-top:8px;padding-left:24px;flex-wrap:wrap}
.badge{
  display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--muted);font-family:var(--mono);
  letter-spacing:.02em;
}
.badge b{color:var(--text-2);font-weight:600}
.mini-bar{flex:1;height:3px;min-width:34px;background:var(--line);border-radius:3px;overflow:hidden}
.mini-bar i{display:block;height:100%;background:var(--solid);border-radius:3px;transition:width .2s}
.add-card{
  margin:4px 8px 10px;padding:7px 10px;border-radius:var(--r-m);color:var(--muted);font-size:12.5px;
  text-align:left;flex:0 0 auto;
}
.add-card:hover{background:var(--panel-2);color:var(--text)}
.add-card-form{margin:2px 8px 10px;display:flex;flex-direction:column;gap:6px}
.add-card-form textarea{
  background:var(--panel-2);border:1px solid var(--line-2);border-radius:var(--r-m);padding:8px 10px;
  font-size:13px;resize:none;min-height:56px;
}
.add-list{
  flex:0 0 260px;width:260px;border:1px dashed var(--line);border-radius:var(--r-l);padding:12px;
  color:var(--muted);font-size:13px;text-align:left;height:fit-content;background:rgba(255,255,255,.012);
}
.add-list:hover{border-color:var(--line-2);color:var(--text);background:var(--panel)}

/* чекбокс */
.check{position:relative;display:inline-grid;place-items:center;width:16px;height:16px;flex:0 0 auto}
.check input{appearance:none;-webkit-appearance:none;width:16px;height:16px;margin:0;border-radius:4px;
  border:1.5px solid var(--line-2);background:transparent;cursor:pointer;transition:.12s;display:block}
.check input:hover{border-color:var(--text-2)}
.check input:checked{background:var(--solid);border-color:var(--solid)}
.check input:checked::after{
  content:"";position:absolute;left:4.5px;top:1.5px;width:4.5px;height:8.5px;
  border:solid var(--solid-text);border-width:0 2px 2px 0;transform:rotate(40deg);pointer-events:none;
}
.check.lg input{width:20px;height:20px;border-radius:5px}
.check.lg input:checked::after{left:6px;top:2px;width:5px;height:10px;border-width:0 2.5px 2.5px 0}

/* ============ МОДАЛЬНОЕ ОКНО ЗАДАЧИ ============ */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(4px);z-index:60;
  display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow:auto;
}
:root[data-theme="light"] .overlay{background:rgba(40,46,52,.42)}
.sheet{
  width:100%;max-width:860px;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin:auto 0;
}
.sheet-head{padding:16px 18px 12px;border-bottom:1px solid var(--line);background:var(--bg-2)}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px;font-size:11.5px;color:var(--muted)}
.crumb{color:var(--text-2);padding:2px 7px;border-radius:5px;border:1px solid var(--line);font-size:11.5px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb:hover{background:var(--panel-2);color:var(--text)}
.crumb-sep{color:var(--line-2)}
.title-row{display:flex;align-items:flex-start;gap:10px}
.title-row .check{margin-top:7px}
.sheet-title{
  flex:1;min-width:0;font-size:19px;font-weight:650;letter-spacing:-.01em;line-height:1.35;
  padding:4px 6px;border-radius:var(--r-s);border:1px solid transparent;resize:none;overflow:hidden;
}
.sheet-title:hover{border-color:var(--line)}
.sheet-title:focus{border-color:var(--line-2);background:var(--panel-2)}
.meta-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding-left:30px}
.pill{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-family:var(--mono);color:var(--muted);
  border:1px solid var(--line);border-radius:20px;padding:2px 9px;background:var(--panel);
}
.pill b{color:var(--text-2);font-weight:600}
.sheet-body{padding:16px 18px 22px;max-height:calc(100vh - 220px);overflow:auto}
.section{margin-bottom:20px}
.section:last-child{margin-bottom:0}
.sec-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sec-title{
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;
}
.sec-line{flex:1;height:1px;background:var(--line)}

/* редактор */
.editor-wrap{border:1px solid var(--line);border-radius:var(--r-m);background:var(--panel-2);overflow:hidden}
.editor-wrap:focus-within{border-color:var(--line-2)}
.toolbar{
  display:flex;align-items:center;gap:2px;flex-wrap:wrap;padding:5px 6px;border-bottom:1px solid var(--line);
  background:var(--bg-2);
}
.tb{
  min-width:26px;height:26px;padding:0 6px;border-radius:5px;color:var(--text-2);font-size:12.5px;
  display:inline-flex;align-items:center;justify-content:center;font-weight:600;
}
.tb:hover{background:var(--panel-3);color:var(--text)}
.tb.sep{width:1px;min-width:1px;height:16px;background:var(--line);margin:0 4px;padding:0;pointer-events:none}
.tb.mono{font-family:var(--mono);font-size:11.5px}
.editor{
  min-height:96px;max-height:420px;overflow:auto;padding:11px 13px;font-size:13.5px;line-height:1.6;
  outline:none;
}
.editor:empty::before{content:attr(data-ph);color:var(--muted);pointer-events:none}
.editor.compact{min-height:62px;max-height:300px;padding:9px 11px;font-size:13px}
.node-body .section{margin-bottom:10px}
.node-tools{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px;padding:3px;
  border:1px dashed transparent;border-radius:8px;
}
.node-tools.hot{border-color:var(--line-2);background:var(--panel-2)}
.node-body .gallery{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));margin-bottom:10px}
.node-body .example:last-child{margin-bottom:0}
.examples.tight{margin-bottom:8px}
.badge svg{flex:0 0 auto}
.tb svg{display:block}
.editor p{margin:0 0 8px}
.editor p:last-child{margin-bottom:0}
.editor h2{font-size:16px;margin:14px 0 7px;font-weight:650}
.editor h3{font-size:14px;margin:12px 0 6px;font-weight:650}
.editor ul,.editor ol{margin:0 0 8px;padding-left:22px}
.editor li{margin:2px 0}
.editor blockquote{
  margin:0 0 8px;padding:6px 12px;border-left:2px solid var(--line-2);color:var(--text-2);
  background:var(--panel-3);border-radius:0 6px 6px 0;
}
.editor pre,.editor code{font-family:var(--mono);font-size:12.5px}
.editor pre{
  background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;
  overflow:auto;margin:0 0 8px;white-space:pre-wrap;
}
.editor a{color:var(--text);text-decoration:underline;text-underline-offset:2px}
.editor img{max-width:100%;border-radius:8px;border:1px solid var(--line);display:block;margin:8px 0}
.editor hr{border:0;border-top:1px solid var(--line);margin:12px 0}

/* изображения */
.drop{
  border:1px dashed var(--line);border-radius:var(--r-m);padding:14px;text-align:center;color:var(--muted);
  font-size:12px;transition:.12s;
}
.drop.hot{border-color:var(--text-2);background:var(--panel-2);color:var(--text)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}
.shot{position:relative;aspect-ratio:1/1;border-radius:var(--r-m);overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.shot img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.shot .del{
  position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;
  background:rgba(0,0,0,.62);color:#fff;font-size:12px;opacity:0;transition:.12s;
}
.shot:hover .del{opacity:1}

/* примеры */
.example{border:1px solid var(--line);border-radius:var(--r-m);margin-bottom:8px;overflow:hidden;background:var(--panel-2)}
.ex-head{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 10px;background:var(--bg-2);border-bottom:1px solid var(--line)}
.ex-title{flex:1;min-width:0;font-size:12.5px;font-weight:600;padding:3px 5px;border-radius:5px;border:1px solid transparent}
.ex-title:hover{border-color:var(--line)}
.ex-title:focus{border-color:var(--line-2);background:var(--panel)}
.ex-body{
  width:100%;min-height:64px;padding:10px 12px;font-family:var(--mono);font-size:12.5px;line-height:1.6;
  resize:vertical;display:block;background:transparent;
}
.ex-tag{font-size:10px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--line);border-radius:4px;padding:1px 5px}

/* дерево подзадач */
.node{border-left:2px solid var(--line);padding-left:0;margin-top:8px}
.node.d1{border-left-color:var(--line-2)}
.node.d2{border-left-color:var(--muted)}
.node.d3{border-left-color:var(--text-2)}
.node.d4{border-left-color:var(--text)}
.node-inner{padding-left:10px}
.node-head{display:flex;align-items:center;gap:7px;padding:5px 6px 5px 4px;border-radius:var(--r-s)}
.node-head:hover{background:var(--panel-2)}
.node-toggle{width:18px;height:18px;display:grid;place-items:center;color:var(--muted);font-size:9px;border-radius:4px;flex:0 0 auto}
.node-toggle:hover{background:var(--line);color:var(--text)}
.node-title{
  flex:1;min-width:0;font-size:13px;padding:3px 5px;border-radius:5px;border:1px solid transparent;
}
.node-title:hover{border-color:var(--line)}
.node-title:focus{border-color:var(--line-2);background:var(--panel-2)}
.node.done .node-title{color:var(--muted);text-decoration:line-through}
.node-prog{font-size:10.5px;font-family:var(--mono);color:var(--muted);flex:0 0 auto}
.node-actions{display:flex;align-items:center;gap:1px;opacity:0;transition:.12s}
.node-head:hover .node-actions,.node-head:focus-within .node-actions{opacity:1}
.node-body{padding:4px 0 8px 14px}
.node-children{margin-top:4px}
.empty-hint{color:var(--muted);font-size:12px;padding:6px 2px}
.kbd-hint{color:var(--muted);font-size:11.5px;margin-top:10px;line-height:1.7}
.kbd-hint kbd{
  font-family:var(--mono);font-size:10.5px;border:1px solid var(--line);border-bottom-width:2px;
  border-radius:4px;padding:1px 5px;background:var(--panel-2);color:var(--text-2);
}

/* лайтбокс / диалоги */
.lightbox{
  position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.9);display:grid;place-items:center;padding:24px;
}
.lightbox img{max-width:100%;max-height:88vh;border-radius:10px;box-shadow:var(--shadow)}
.lightbox .close{position:absolute;top:16px;right:18px;color:#fff;font-size:22px;opacity:.8}
.dialog{
  position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.62);display:grid;place-items:center;padding:20px;
  backdrop-filter:blur(3px);
}
.dialog-card{
  width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);padding:18px;
}
.dialog-card h3{margin:0 0 6px;font-size:15px}
.dialog-card p{margin:0 0 14px;color:var(--text-2);font-size:13px}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px}
.io-tabs{display:flex;gap:4px;margin:0 0 12px;border-bottom:1px solid var(--line)}
.io-tabs button{padding:7px 11px;border-radius:8px 8px 0 0;font-size:12.5px;color:var(--text-2);border-bottom:2px solid transparent}
.io-tabs button:hover{color:var(--text)}
.io-tabs button.on{color:var(--text);border-bottom-color:var(--solid);background:var(--panel-2)}
.io-area{
  width:100%;height:180px;font-family:var(--mono);font-size:11.5px;background:var(--bg);
  border:1px solid var(--line);border-radius:var(--r-m);padding:10px;resize:vertical;
}

/* тост */
.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);z-index:120;
  background:var(--solid);color:var(--solid-text);font-size:12.5px;font-weight:600;
  padding:9px 16px;border-radius:20px;box-shadow:var(--shadow);opacity:0;pointer-events:none;
  transition:.2s;max-width:80vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* на устройствах без hover элементы управления показываем всегда */
@media (hover:none){
  .board-item .bi-del,
  .node-actions,
  .shot .del{opacity:1}
  .card{cursor:default}
}
/* адаптив */
@media (max-width:900px){
  .sidebar{position:fixed;inset:0 auto 0 0;z-index:70;box-shadow:var(--shadow);margin-left:-280px}
  .sidebar.open{margin-left:0}
  .icon-btn.hamb{display:grid}
  .search{width:140px}
  .list{flex-basis:270px}
  .sheet-body{max-height:none}
  .overlay{padding:0;align-items:stretch}
  .sheet{max-width:none;border-radius:0;min-height:100%}
}
@media (max-width:560px){
  .search{display:none}
  .topbar{padding:8px 10px;gap:6px}
  .board{padding:12px 10px}
  .board-name{font-size:14px;max-width:150px}
  .list{flex-basis:82vw}
}

/* ================= СЛОИ ФОНА И СНЕГ ================= */
.app{position:relative;z-index:1}
body.auth-mode .app,
body.auth-mode #scrim{display:none}
.bg-layer{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--bg);transition:background .25s}
.bg-image{
  position:absolute;inset:-60px;background-repeat:no-repeat;background-size:cover;
  background-position:center center;transition:filter .25s ease, transform .25s ease;
}
.bg-shade{position:absolute;inset:0;transition:background .25s ease}
.snow{position:fixed;inset:0;z-index:55;pointer-events:none;display:none}
.snow.on{display:block}

/* «стеклянный» режим, когда фон не графит */
html.has-bg[data-theme="dark"]{
  --bg:rgba(10,12,14,.32);
  --bg-2:rgba(14,16,19,.55);
  --panel:rgba(20,23,26,.62);
  --panel-2:rgba(27,31,35,.66);
  --panel-3:rgba(35,40,45,.72);
  --line:rgba(255,255,255,.10);
  --line-2:rgba(255,255,255,.20);
}
html.has-bg[data-theme="light"]{
  --bg:rgba(238,240,243,.34);
  --bg-2:rgba(250,251,252,.58);
  --panel:rgba(255,255,255,.64);
  --panel-2:rgba(246,247,249,.68);
  --panel-3:rgba(238,240,243,.76);
  --line:rgba(18,22,26,.12);
  --line-2:rgba(18,22,26,.24);
}
html.has-bg .sidebar,
html.has-bg .topbar,
html.has-bg .list,
html.has-bg .sheet,
html.has-bg .dialog-card,
html.has-bg .auth-card,
html.has-bg .menu{
  backdrop-filter:blur(16px) saturate(120%);
  -webkit-backdrop-filter:blur(16px) saturate(120%);
}
html.has-bg .board{background-image:none}

/* ================= АККАУНТ ================= */
.user-chip{height:34px;padding:0 10px 0 4px;gap:8px;max-width:190px}
.avatar{
  width:26px;height:26px;border-radius:50%;background:var(--solid);color:var(--solid-text);
  display:grid;place-items:center;font-size:10.5px;font-weight:800;letter-spacing:.02em;flex:0 0 auto;
}
.user-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.menu{
  position:absolute;z-index:130;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);padding:6px;min-width:210px;
}
.menu button{
  display:flex;width:100%;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;
  font-size:13px;color:var(--text-2);text-align:left;
}
.menu button:hover{background:var(--panel-2);color:var(--text)}
.menu button.danger:hover{background:var(--danger-bg);color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.menu-head{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:5px}
.menu-head b{display:block;font-size:13px;color:var(--text)}
.menu-head span{font-size:11.5px;color:var(--muted)}

/* ================= ЭКРАН ВХОДА ================= */
.auth{
  position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:22px;overflow:auto;
  background:linear-gradient(165deg, rgba(8,9,11,.90), rgba(8,9,11,.97));
}
html[data-theme="light"] .auth{background:linear-gradient(165deg, rgba(232,235,238,.94), rgba(224,227,231,.98))}
.auth-card{
  width:100%;max-width:430px;background:var(--panel);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);padding:26px 24px 22px;
}
.auth-brand{display:flex;align-items:center;gap:11px;margin-bottom:20px}
.auth-brand .brand-mark{width:40px;height:40px;font-size:14px;border-radius:11px}
.auth-title{font-size:17px;font-weight:700;letter-spacing:-.01em}
.auth-sub{font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.ulist{margin:0 0 12px}
.urow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.urow:last-child{border-bottom:0}
.uinfo{min-width:0;flex:1 1 auto}
.uname{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ulogin{font-size:11.5px;color:var(--muted);font-family:var(--mono,inherit)}
.ubadge{font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line-2);
  border-radius:999px;padding:2px 8px;color:var(--muted);white-space:nowrap}
.ubadge.admin{background:var(--solid);color:var(--solid-text);border-color:var(--solid)}
.uacts{display:flex;gap:6px;flex:0 0 auto}
.uacts .btn{padding:5px 9px;font-size:11.5px}
.unew{margin-top:4px}
.auth-lead{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;font-weight:600}
.auth-tabs{display:flex;gap:4px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:18px}
.auth-tab{flex:1;height:32px;border-radius:7px;color:var(--text-2);font-size:13px;font-weight:600;transition:.12s}
.auth-tab:hover{color:var(--text)}
.auth-tab.active{background:var(--solid);color:var(--solid-text)}
.field{margin-bottom:12px}
.field > label{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:600}
.input{
  width:100%;height:38px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
  padding:0 12px;font-size:13.5px;color:var(--text);transition:.12s;
}
.input:focus{border-color:var(--line-2);background:var(--panel-3)}
.input.bad{border-color:var(--danger)}
.checkline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2);margin:4px 0 16px;cursor:pointer}
.auth-msg{
  display:none;font-size:12.5px;line-height:1.5;border-radius:9px;padding:9px 11px;margin-bottom:12px;
  border:1px solid var(--line-2);background:var(--panel-2);color:var(--text);
}
.auth-msg.show{display:block}
.auth-note{font-size:11.5px;color:var(--muted);line-height:1.65;margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.auth-note b{color:var(--text-2);font-weight:600}
.auth-submit{width:100%}

/* ================= ПАНЕЛЬ ОФОРМЛЕНИЯ ================= */
.prefs{
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;
  background:rgba(0,0,0,.6);backdrop-filter:blur(4px);overflow:auto;
}
html[data-theme="light"] .prefs{background:rgba(38,44,50,.42)}
.prefs-card{
  width:100%;max-width:1120px;height:min(88vh,600px);display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);overflow:hidden;margin:auto;
}
.prefs-head{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--bg-2)}
.prefs-head h3{margin:0;font-size:14px;font-weight:650}
.prefs-tabs{flex:0 0 auto;display:flex;gap:2px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--bg-2);overflow-x:auto}
.prefs-tabs button{padding:6px 12px;border-radius:8px;font-size:12.5px;color:var(--text-2);font-weight:500;white-space:nowrap;flex:0 0 auto}
.prefs-tabs button:hover{color:var(--text);background:var(--panel-2)}
.prefs-tabs button.on{background:var(--solid);color:var(--solid-text)}
.prefs-body{flex:1 1 auto;min-height:0;padding:6px 18px 14px;overflow:auto;overscroll-behavior:contain}
.fx-col{min-width:0}
@media (min-width:1000px){
  .prefs-body{display:grid;grid-template-columns:1fr 1fr;column-gap:30px;align-items:start}
  .prefs-body > .prefs-row{grid-column:auto}
  .prefs-body > .sec-title,
  .prefs-body > .prefs-sub,
  .prefs-body > .auth-msg,
  .prefs-body > .field,
  .prefs-body > .unew,
  .prefs-body > .ulist,
  .prefs-body > .prefs-hint,
  .prefs-body > div[style]{grid-column:1 / -1}
  .prefs-row + .prefs-row{border-top:0}
}
.prefs-foot{flex:0 0 auto;display:flex;gap:8px;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line);background:var(--bg-2)}
.prefs-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.prefs-row:last-child{border-bottom:0}
.prefs-row .pr-main{min-width:0}
.prefs-label{font-size:13px;font-weight:500}
.prefs-hint{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.seg{display:flex;gap:3px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{min-width:auto;height:28px;padding:0 11px;border-radius:7px;font-size:12.5px;color:var(--text-2);font-weight:500;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--solid);color:var(--solid-text)}
.prefs-sub{padding:10px 0 4px;display:none}
.prefs-sub.show{display:block}
.slider-row{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.slider-row label{font-size:12px;color:var(--text-2);min-width:96px}
.slider-row output{font-size:11.5px;font-family:var(--mono);color:var(--muted);min-width:38px;text-align:right}
input[type="range"]{
  -webkit-appearance:none;appearance:none;height:4px;border-radius:3px;background:var(--line-2);
  flex:1;min-width:80px;cursor:pointer;
}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--solid);
  border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line-2);cursor:pointer;
}
input[type="range"]::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;background:var(--solid);border:2px solid var(--panel);cursor:pointer;
}
input[type="color"]{
  width:38px;height:30px;padding:2px;border:1px solid var(--line);border-radius:7px;
  background:var(--panel-2);cursor:pointer;
}
.switch{position:relative;width:40px;height:22px;border-radius:20px;background:var(--line-2);cursor:pointer;transition:.15s;flex:0 0 auto}
.switch.on{background:var(--solid)}
.switch i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--panel);transition:.15s}
.switch.on i{left:21px;background:var(--solid-text)}
.bg-preview{
  height:130px;border-radius:11px;border:1px solid var(--line);background-size:cover;background-position:center;
  display:grid;place-items:center;color:var(--muted);font-size:12px;overflow:hidden;margin-bottom:10px;
  background-color:var(--panel-2);
}
.bg-preview.hot{border-color:var(--line-2);color:var(--text);background-color:var(--panel-3)}
.users-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--text-2);padding:8px 0}
.link-btn{color:var(--text);text-decoration:underline;text-underline-offset:2px;font-size:12.5px}
@media (max-width:700px){
  .prefs{padding:10px}
  .prefs-card{height:min(92vh,760px)}
  .user-name{display:none}
  .user-chip{padding:0 4px}
  .prefs-row{flex-wrap:wrap}
  .auth-card{padding:20px 16px}
}
@media (prefers-reduced-motion:reduce){
  .bg-image{transition:none}
}

<body>
<div class="bg-layer" id="bgLayer" aria-hidden="true">
  <div class="bg-image" id="bgImage"></div>
  <div class="bg-shade" id="bgShade"></div>
</div>
<canvas class="snow" id="snowCanvas" aria-hidden="true"></canvas>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark" role="img" aria-label="Shokydo"></div>
      <div>
        <div class="brand-name">OmniBoard</div>

      </div>
    </div>
    <div class="side-scroll">
      <div class="side-title">

    <div class="side-foot">
      <button class="btn sm" id="exportBtn" title="Экспорт и импорт: JSON, Markdown">Экспорт</button>
      <button class="btn sm" id="prefsBtn" title="Настройки: оформление, эффекты, аккаунт">⚙ Настройки</button>
    </div>

  <main class="main">

      <button class="icon-btn hamb" id="hambBtn" title="Меню">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <input class="board-name" id="boardName" value="Доска" aria-label="Название доски">
      <span class="pill" id="boardStat">0 задач</span>

        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" placeholder="Поиск по доске" aria-label="Поиск">
      </label>
      <button class="btn" id="addListTop">+ Список</button>
      <button class="btn user-chip" id="userChip" title="Аккаунт">

<div id="authHost"></div>
<div id="prefsHost"></div>
<div class="scrim" id="scrim"></div>
<div id="overlayHost"></div>
<div id="dialogHost"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

/* ======================= УТИЛИТЫ ======================= */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
let _n = 0;
const uid = (p) => (p || 'id') + '_' + Date.now().toString(36) + (++_n).toString(36) + Math.random().toString(36).slice(2, 6);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const debounce = (fn, ms) => { let t; return function(){ const a = arguments, self = this; clearTimeout(t); t = setTimeout(() => fn.apply(self, a), ms); }; };
const nowISO = () => new Date().toISOString();
const plural = (n, f) => { const a = Math.abs(n) % 100, b = a % 10; if (a > 10 && a < 20) return f[2]; if (b > 1 && b < 5) return f[1]; if (b === 1) return f[0]; return f[2]; };
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

function cleanHTML(html){
  if (!html) return '';
  const d = document.createElement('div');
  d.innerHTML = html;
  $$('script,style,iframe,object,embed,link,meta', d).forEach(n => n.remove());
  $$('*', d).forEach(n => {
    Array.prototype.slice.call(n.attributes).forEach(a => {
      if (/^on/i.test(a.name)) n.removeAttribute(a.name);
      if ((a.name === 'href' || a.name === 'src') && /^\s*(javascript|data:text\/html)/i.test(a.value)) n.removeAttribute(a.name);
    });
  });
  return d.innerHTML;
}

/* ======================= СОСТОЯНИЕ ======================= */
let storageOK = true;
let noStorageNotified = false;
let state = { version: 2, theme: 'dark', activeBoard: null, boards: [], tasks: {} };

let openTaskId = null;
let modalStack = [];
const openNodes = new Set();
let dragCardId = null;
let dragListId = null;
let dragPlaceholder = null;
let listPlaceholder = null;
function removeListPlaceholder(){
  if (listPlaceholder && listPlaceholder.parentNode) listPlaceholder.parentNode.removeChild(listPlaceholder);
  listPlaceholder = null;
  $$('.list.drag-off').forEach(l => l.classList.remove('drag-off'));
}
let searchQuery = '';
let pendingFocus = null;

/* ======================= ХРАНИЛИЩЕ ======================= */
function load(){
  try {
    const raw = lsGet(dataKey());
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d || !Array.isArray(d.boards) || typeof d.tasks !== 'object') return false;
    state.boards = d.boards;
    state.tasks = d.tasks;
    state.theme = d.theme === 'light' ? 'light' : 'dark';
    state.activeBoard = d.activeBoard || (d.boards[0] && d.boards[0].id) || null;
    Object.keys(state.tasks).forEach(id => {
      const t = state.tasks[id];
      t.desc = cleanHTML(t.desc || '');
      t.images = Array.isArray(t.images) ? t.images : [];
      t.examples = Array.isArray(t.examples) ? t.examples : [];
      t.subtasks = Array.isArray(t.subtasks) ? t.subtasks.filter(x => state.tasks[x]) : [];
    });
    return true;
  } catch (e) { storageOK = false; return false; }
}

function saveNow(){
  try {
    storageOK = lsSet(dataKey(), JSON.stringify(state));
  } catch (e) {
    storageOK = false;
    if (!noStorageNotified){
      noStorageNotified = true;
      toast('Автосохранение недоступно в этом окне. Откройте файл в браузере или выгрузите JSON.', 6000);
    }
  }
}
const save = debounce(saveNow, 250);

/* ======================= МОДЕЛЬ ======================= */
const T = (id) => state.tasks[id] || null;
const board = () => state.boards.find(b => b.id === state.activeBoard) || null;

function depthOf(t){
  let d = 0, cur = t, guard = 0;
  while (cur && cur.parentId && state.tasks[cur.parentId] && guard++ < 200){ d++; cur = state.tasks[cur.parentId]; }
  return d;
}

function ancestorsOf(t){
  const arr = []; let cur = t, guard = 0;
  while (cur && cur.parentId && state.tasks[cur.parentId] && guard++ < 200){ cur = state.tasks[cur.parentId]; arr.unshift(cur); }
  return arr;
}

function stats(t){
  let total = 0, done = 0;
  (t.subtasks || []).forEach(id => {
    const c = state.tasks[id]; if (!c) return;
    const s = stats(c);
    total += 1 + s.total;
    done += (c.done ? 1 : 0) + s.done;
  });
  return { total, done };
}

function matches(t, q){
  if (!q) return true;
  if ((t.title || '').toLowerCase().indexOf(q) > -1) return true;
  if ((t.desc || '').replace(/<[^>]*>/g, ' ').toLowerCase().indexOf(q) > -1) return true;
  return (t.subtasks || []).some(id => state.tasks[id] && matches(state.tasks[id], q));
}

function touch(t){ t.updated = nowISO(); }

function createTask(opts){
  const t = {
    id: uid('t'), title: opts.title || 'Новая задача', desc: '', done: false,
    images: [], examples: [], subtasks: [], parentId: opts.parentId || null,
    created: nowISO(), updated: nowISO()
  };
  state.tasks[t.id] = t;
  if (t.parentId && state.tasks[t.parentId]) state.tasks[t.parentId].subtasks.push(t.id);
  else if (opts.listId) {
    const b = board();
    const l = b && b.lists.find(x => x.id === opts.listId);
    if (l) l.cards.push(t.id);
  }
  save();
  return t;
}

function removeTask(id, silent){
  const t = state.tasks[id]; if (!t) return;
  t.subtasks.slice().forEach(cid => removeTask(cid, true));
  if (t.parentId && state.tasks[t.parentId]){
    const p = state.tasks[t.parentId];
    p.subtasks = p.subtasks.filter(x => x !== id);
  }
  state.boards.forEach(b => b.lists.forEach(l => {
    const i = l.cards.indexOf(id);
    if (i > -1) l.cards.splice(i, 1);
  }));
  delete state.tasks[id];
  if (!silent) save();
}

function moveTaskTo(id, newParentId){
  const t = state.tasks[id]; if (!t) return;
  if (t.parentId && state.tasks[t.parentId]) state.tasks[t.parentId].subtasks = state.tasks[t.parentId].subtasks.filter(x => x !== id);
  // защита от цикла
  let p = newParentId ? state.tasks[newParentId] : null, guard = 0;
  while (p && guard++ < 200){ if (p.id === id) return; p = p.parentId ? state.tasks[p.parentId] : null; }
  t.parentId = newParentId || null;
  if (t.parentId && state.tasks[t.parentId]) state.tasks[t.parentId].subtasks.push(id);
  save();
}

/* ======================= ДЕМО-ДАННЫЕ ======================= */
function seed(){
  const b1 = { id: uid('b'), title: 'Продукт', created: nowISO(), lists: [
    { id: uid('l'), title: 'Бэклог', cards: [] },
    { id: uid('l'), title: 'В работе', cards: [] },
    { id: uid('l'), title: 'Готово', cards: [] }
  ]};
  const b2 = { id: uid('b'), title: 'Личное', created: nowISO(), lists: [
    { id: uid('l'), title: 'Дела', cards: [] },
    { id: uid('l'), title: 'Сделано', cards: [] }
  ]};
  state.boards = [b1, b2];

  function put(t, listIdx){
    state.tasks[t.id] = t;
    if (t.parentId && state.tasks[t.parentId]) state.tasks[t.parentId].subtasks.push(t.id);
    else b1.lists[listIdx].cards.push(t.id);
    return t;
  }
  const mk = (title, extra) => Object.assign({
    id: uid('t'), title: title, desc: '', done: false, images: [], examples: [],
    subtasks: [], parentId: null, created: nowISO(), updated: nowISO()
  }, extra || {});

  /* --- Задача 1: корневая с глубокой вложенностью --- */
  const root = put(mk('Спроектировать систему вложенных задач', {
    desc: '<p>Нужна структура <strong>задача → подзадача → подзадача</strong> без ограничения по глубине, с прогрессом по всему поддереву.</p><ul><li>хранение в плоском словаре <code>tasks</code></li><li>дерево строится по массиву <code>subtasks[]</code></li><li>удаление ветки — рекурсивное</li></ul><blockquote>Каждая подзадача — такая же полноценная задача: описание, изображения, примеры, свои подзадачи.</blockquote>',
    examples: [{
      id: uid('ex'), title: 'Модель данных', mode: 'code',
      body: 'task = {\n  id, title, desc, done,\n  images: [], examples: [],\n  subtasks: [id, id],\n  parentId\n}'
    }]
  }), 0);

  const sub1 = mk('Определить модель данных', { parentId: root.id, done: true,
    desc: '<p>Плоский словарь + ссылки на детей. Так проще обновлять и не надо рекурсивно сериализовать объект.</p>' });
  state.tasks[sub1.id] = sub1; root.subtasks.push(sub1.id);

  const sub11 = mk('Плоский словарь + parentId', { parentId: sub1.id, done: true,
    desc: '<p>Каждая задача знает своего родителя — легко строить хлебные крошки и считать уровень.</p>' });
  state.tasks[sub11.id] = sub11; sub1.subtasks.push(sub11.id);

  const sub12 = mk('Рекурсивный подсчёт прогресса', { parentId: sub1.id, done: true,
    desc: '<p><code>stats(task)</code> возвращает <code>{total, done}</code> по всему поддереву.</p>' });
  state.tasks[sub12.id] = sub12; sub1.subtasks.push(sub12.id);

  const sub2 = mk('Отрисовка дерева', { parentId: root.id });
  state.tasks[sub2.id] = sub2; root.subtasks.push(sub2.id);

  const sub21 = mk('Отступ и цвет ветки по уровню', { parentId: sub2.id, done: true,
    desc: '<p>Левый бордер светлеет с каждым уровнем — глубина читается визуально, без цифр.</p>' });
  state.tasks[sub21.id] = sub21; sub2.subtasks.push(sub21.id);

  const sub22 = mk('Сворачивание узлов', { parentId: sub2.id,
    desc: '<p>Клик по треугольнику скрывает всё поддерево, не теряя содержимого.</p>' });
  state.tasks[sub22.id] = sub22; sub2.subtasks.push(sub22.id);

  const sub221 = mk('Запоминать открытые узлы', { parentId: sub22.id,
    desc: '<p>Набор открытых id живёт в памяти сессии — при перерисовке дерево не схлопывается.</p>' });
  state.tasks[sub221.id] = sub221; sub22.subtasks.push(sub221.id);

  put(mk('Редактор текста в карточке', {
    desc: '<p>Панель форматирования без внешних библиотек: жирный, курсив, подчёркивание, заголовки, списки, цитаты, блок кода, ссылки.</p><p>Картинки можно вставить прямо в текст — <em>Ctrl+V</em> из буфера.</p>',
    examples: [{ id: uid('ex'), title: 'Что поддержать', mode: 'note',
      body: 'B / I / U / S, H2, H3, маркированный и нумерованный список, цитата, код, ссылка, линия-разделитель, вставка изображения.' }]
  }), 1);

  const ed2 = createTaskSeedChild('Изображения и примеры', [
    'Галерея изображений с увеличением и удалением',
    'Примеры: заметка или блок кода'
  ]);
  function createTaskSeedChild(title, children){
    const p = mk(title, { parentId: root.id, desc: '<p>Всё это доступно на каждом уровне вложенности, а не только в корневой задаче.</p>' });
    state.tasks[p.id] = p; root.subtasks.push(p.id);
    children.forEach(c => {
      const ch = mk(c, { parentId: p.id });
      state.tasks[ch.id] = ch; p.subtasks.push(ch.id);
    });
    return p;
  }

  put(mk('Перетаскивание карточек', {
    desc: '<p>Карточки таскаются между колонками и внутри колонки. Списки тоже можно менять местами — за ручку <strong>⋮⋮</strong>.</p>',
    done: false
  }), 1);

  put(mk('Графитовая тема', { desc: '<p>Только чёрный, белый и серая шкала. Никаких цветных акцентов — состояние читается за счёт контраста и толщины линий.</p>', done: true }), 2);
  put(mk('Экспорт и импорт JSON', { desc: '<p>Резервная копия всех досок одним файлом.</p>', done: true }), 2);

  const p1 = mk('Купить лампу', { done: false, desc: '<p>Тёплый свет 2700K.</p>' });
  state.tasks[p1.id] = p1; b2.lists[0].cards.push(p1.id);
  const p2 = mk('Разобрать папку «Загрузки»', { done: true });
  state.tasks[p2.id] = p2; b2.lists[1].cards.push(p2.id);

  state.activeBoard = b1.id;
  state.theme = 'dark';
}

/* ======================= ТОСТЫ И ДИАЛОГИ ======================= */
let toastTimer = null;
function toast(msg, ms){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms || 2600);
}

function closeDialog(){ $('#dialogHost').innerHTML = ''; }

function askConfirm(opts){
  return new Promise(resolve => {
    const host = $('#dialogHost');
    host.innerHTML = '<div class="dialog"><div class="dialog-card">' +
      '<h3>' + esc(opts.title || 'Удалить?') + '</h3>' +
      '<p>' + esc(opts.text || '') + '</p>' +
      '<div class="dialog-actions">' +
      '<button class="btn" data-r="0">Отмена</button>' +
      '<button class="btn ' + (opts.danger ? 'danger' : 'solid') + '" data-r="1">' + esc(opts.ok || 'Удалить') + '</button>' +
      '</div></div></div>';
    const overlay = host.firstChild;
    overlay.addEventListener('click', e => {
      const b = e.target.closest('[data-r]');
      if (b){ const v = b.dataset.r === '1'; closeDialog(); resolve(v); }
      else if (e.target === overlay){ closeDialog(); resolve(false); }
    });
  });
}

function askText(opts){
  return new Promise(resolve => {
    const host = $('#dialogHost');
    host.innerHTML = '<div class="dialog"><div class="dialog-card">' +
      '<h3>' + esc(opts.title || 'Введите текст') + '</h3>' +
      (opts.text ? '<p>' + esc(opts.text) + '</p>' : '') +
      '<input class="io-input" id="askInput" placeholder="' + esc(opts.placeholder || '') + '" ' +
        'style="width:100%;background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;font-size:13.5px;margin-bottom:14px">' +
      '<div class="dialog-actions">' +
      '<button class="btn" data-r="0">Отмена</button>' +
      '<button class="btn solid" data-r="1">' + esc(opts.ok || 'Готово') + '</button>' +
      '</div></div></div>';
    const overlay = host.firstChild;
    const input = $('#askInput');
    input.value = opts.value || '';
    setTimeout(() => { input.focus(); input.select(); }, 30);
    const done = (v) => { closeDialog(); resolve(v); };
    overlay.addEventListener('click', e => {
      const b = e.target.closest('[data-r]');
      if (b){ done(b.dataset.r === '1' ? input.value.trim() : null); }
      else if (e.target === overlay){ done(null); }
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter'){ e.preventDefault(); done(input.value.trim()); }
    });
  });
}

function renderSidebar(){

  host.innerHTML = '';
  state.boards.forEach(b => {
    const row = document.createElement('div');
    const count = b.lists.reduce((n, l) => n + l.cards.length, 0);

    row.querySelector('.bi-count').textContent = count;

/* ======================= РЕНДЕР: ДОСКА ======================= */
function renderBoard(){
  const b = board();
  const nameInput = $('#boardName');
  if (document.activeElement !== nameInput) nameInput.value = b ? b.title : '';

  const host = $('#lists');
  host.innerHTML = '';
  if (!b){
    $('#boardStat').textContent = 'нет досок';
    return;
  }
  const total = b.lists.reduce((n, l) => n + l.cards.length, 0);
  $('#boardStat').textContent = total + ' ' + plural(total, ['задача', 'задачи', 'задач']);

  const q = searchQuery.trim().toLowerCase();
  b.lists.forEach(l => host.appendChild(renderList(l, q)));

  const addBtn = document.createElement('button');
  addBtn.className = 'add-list';
  addBtn.textContent = '+ Добавить список';
  addBtn.addEventListener('click', addList);
  host.appendChild(addBtn);
}

function renderList(l, q){
  const el = document.createElement('section');
  el.className = 'list';
  el.dataset.list = l.id;

  const visible = l.cards.filter(id => { const t = T(id); return t && matches(t, q); });

  el.innerHTML =
    '<div class="list-head">' +
      '<span class="drag-handle" draggable="true" title="Перетащить список">⋮⋮</span>' +
      '<input class="list-title" value="' + esc(l.title) + '" aria-label="Название списка">' +
      '<span class="list-count">' + visible.length + '</span>' +
      '<button class="icon-btn sm" data-act="del-list" title="Удалить список">✕</button>' +
    '</div>' +
    '<div class="cards" data-list="' + l.id + '"></div>' +
    '<button class="add-card" data-act="add-card">＋ Добавить задачу</button>';

  const cardsHost = el.querySelector('.cards');
  visible.forEach(id => cardsHost.appendChild(renderCard(T(id))));

  return el;
}

/* ======================= DRAG & DROP (pointer events) ======================= */
let suppressClick = false;
let pdrag = null;

function isInteractiveEl(el){
  return !!el.closest('input, textarea, select, button, a, label.check, .check, .badge');
}

function onPointerDown(e){
  if (e.button !== 0 || openTaskId) return;
  if ($('#dialogHost') && $('#dialogHost').innerHTML) return;
  const handle = e.target.closest('.drag-handle');
  const cardEl = e.target.closest('.card');
  if (handle){
    const listEl = handle.closest('.list');
    if (!listEl) return;
    pdrag = { type: 'list', id: listEl.dataset.list, el: listEl, x: e.clientX, y: e.clientY, active: false, pointerType: e.pointerType || 'mouse' };
  } else if (cardEl && !isInteractiveEl(e.target)){
    pdrag = { type: 'card', id: cardEl.dataset.id, el: cardEl, x: e.clientX, y: e.clientY, active: false, pointerType: e.pointerType || 'mouse' };
  } else return;

  if (pdrag.pointerType === 'touch'){
    pdrag.timer = setTimeout(function(){ if (pdrag && !pdrag.active) activateDrag(pdrag.x, pdrag.y); }, 280);
  }
  window.addEventListener('pointermove', onPointerMove, { passive: false });
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerUp);
}

function activateDrag(x, y){
  const d = pdrag;
  if (!d || d.active) return;
  d.active = true;
  if (d.timer) clearTimeout(d.timer);

  const rect = d.el.getBoundingClientRect();
  const ghost = d.el.cloneNode(true);
  ghost.classList.add('drag-ghost');
  ghost.removeAttribute('data-id');
  ghost.style.width = rect.width + 'px';
  ghost.style.left = rect.left + 'px';
  ghost.style.top = rect.top + 'px';
  document.body.appendChild(ghost);
  d.ghost = ghost;
  d.offX = x - rect.left;
  d.offY = y - rect.top;

  d.el.classList.add('dragging', 'drag-off');   /* источник убираем из потока */
  document.body.classList.add('is-dragging');
  moveGhost(x, y);

  if (d.type === 'card'){
    const host = d.el.closest('.cards');
    if (host){
      const ph = getPlaceholder();
      host.insertBefore(ph, d.el);
    }
  } else {
    const listsHost = $('#lists');
    if (!listPlaceholder){
      listPlaceholder = document.createElement('div');
      listPlaceholder.className = 'list-placeholder';
    }
    if (listsHost && d.el.parentNode === listsHost) listsHost.insertBefore(listPlaceholder, d.el);
  }
}

function moveGhost(x, y){
  const d = pdrag;
  if (!d || !d.ghost) return;
  d.ghost.style.left = (x - d.offX) + 'px';
  d.ghost.style.top = (y - d.offY) + 'px';
}

function onPointerMove(e){
  const d = pdrag;
  if (!d) return;
  if (!d.active){
    const dx = Math.abs(e.clientX - d.x), dy = Math.abs(e.clientY - d.y);
    if (d.pointerType === 'touch'){
      if (dx + dy > 12) finishDrag();      /* это скролл, не перетаскивание */
      return;
    }
    if (dx + dy < 5) return;
    activateDrag(e.clientX, e.clientY);
  }
  if (e.cancelable) e.preventDefault();
  moveGhost(e.clientX, e.clientY);
  if (d.type === 'card') updateCardTarget(e.clientX, e.clientY);
  else updateListTarget(e.clientX, e.clientY);
}

function updateCardTarget(x, y){
  const under = document.elementFromPoint(x, y);
  const cardsHost = under && under.closest ? under.closest('.cards') : null;
  const ph = dragPlaceholder;
  if (!cardsHost || !ph) return;
  const listEl = cardsHost.closest('.list');
  $$('.list').forEach(function(l){ l.classList.toggle('drag-over', l === listEl); });
  const after = dragAfterElement(cardsHost, y) || null;
  if (ph.parentNode !== cardsHost || ph.nextSibling !== after){
    if (after) cardsHost.insertBefore(ph, after);
    else cardsHost.appendChild(ph);
  }
}

function updateListTarget(x){
  const listsHost = $('#lists');
  if (!listPlaceholder || !listsHost) return;
  const after = dragAfterList(listsHost, x) || null;
  const ref = after || listsHost.querySelector('.add-list');
  if (listPlaceholder.nextSibling !== ref){
    if (ref) listsHost.insertBefore(listPlaceholder, ref);
    else listsHost.appendChild(listPlaceholder);
  }
}

function onPointerUp(){
  const d = pdrag;
  if (!d){ return; }
  if (d.active){
    suppressClick = true;
    setTimeout(function(){ suppressClick = false; }, 80);
    const type = d.type, id = d.id;
    if (type === 'card' && dragPlaceholder && dragPlaceholder.parentNode){
      const host = dragPlaceholder.parentNode;
      const listEl = host.closest('.list');
      const idx = placeholderIndex(host);
      const listId = listEl ? listEl.dataset.list : null;
      finishDrag();
      if (listId) moveCardTo(id, listId, idx);
      return;
    }
    if (type === 'list' && listPlaceholder && listPlaceholder.parentNode){
      const idx = listPlaceholderIndex();
      finishDrag();
      reorderList(id, idx);
      return;
    }
  }
  finishDrag();
}

function finishDrag(){
  const d = pdrag;
  pdrag = null;
  if (d){
    if (d.timer) clearTimeout(d.timer);
    if (d.ghost && d.ghost.parentNode) d.ghost.parentNode.removeChild(d.ghost);
    if (d.el) d.el.classList.remove('dragging', 'drag-off');
  }
  window.removeEventListener('pointermove', onPointerMove);
  window.removeEventListener('pointerup', onPointerUp);
  window.removeEventListener('pointercancel', onPointerUp);
  removePlaceholder();
  removeListPlaceholder();
  $$('.list').forEach(function(l){ l.classList.remove('drag-over'); });
  document.body.classList.remove('is-dragging');
}

function reorderList(id, idx){
  const b = board();
  if (!b) return;
  const l = b.lists.find(function(x){ return x.id === id; });
  if (!l) return;
  b.lists = b.lists.filter(function(x){ return x.id !== id; });
  b.lists.splice(clamp(idx, 0, b.lists.length), 0, l);
  save(); renderBoard(); renderSidebar();
}

function getPlaceholder(){
  if (!dragPlaceholder){
    dragPlaceholder = document.createElement('div');
    dragPlaceholder.className = 'card-placeholder';
  }
  return dragPlaceholder;
}

function removePlaceholder(){
  if (dragPlaceholder && dragPlaceholder.parentNode) dragPlaceholder.parentNode.removeChild(dragPlaceholder);
  dragPlaceholder = null;
  $$('.list').forEach(l => l.classList.remove('drag-over'));
  $$('.card.drag-off').forEach(c => c.classList.remove('drag-off'));
}

function placeholderIndex(container){
  const ph = dragPlaceholder;
  if (!ph || ph.parentNode !== container) return 0;
  let idx = 0;
  const kids = Array.prototype.slice.call(container.children);
  for (let i = 0; i < kids.length; i++){
    const k = kids[i];
    if (k === ph) return idx;
    if (k.classList.contains('card') && !k.classList.contains('dragging')) idx++;
  }
  return idx;
}

function listPlaceholderIndex(){
  const listsHost = $('#lists');
  const ph = listPlaceholder;
  if (!ph || ph.parentNode !== listsHost) return 0;
  let idx = 0;
  const kids = Array.prototype.slice.call(listsHost.children);
  for (let i = 0; i < kids.length; i++){
    const k = kids[i];
    if (k === ph) return idx;
    if (k.classList.contains('list') && !k.classList.contains('dragging')) idx++;
  }
  return idx;
}

function dragAfterElement(container, y){
  const items = $$('.card:not(.dragging)', container);
  let closest = null, closestOffset = -Infinity;
  items.forEach(child => {
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > closestOffset){ closestOffset = offset; closest = child; }
  });
  return closest;
}

function moveCardTo(id, listId, index){
  const b = board(); if (!b) return;
  b.lists.forEach(l => {
    const i = l.cards.indexOf(id);
    if (i > -1) l.cards.splice(i, 1);
  });
  const to = b.lists.find(l => l.id === listId);
  if (!to) return;
  to.cards.splice(clamp(index, 0, to.cards.length), 0, id);
  save();
  renderBoard();
  renderSidebar();
}

function renderCard(t){
  const s = stats(t);
  const pct = s.total ? Math.round(s.done / s.total * 100) : 0;
  const card = document.createElement('article');
  card.className = 'card' + (t.done ? ' done' : '');
  card.dataset.id = t.id;
  card.draggable = false;
  const title = document.createElement('div');
  title.className = 'card-title';
  title.textContent = t.title || 'Без названия';

  const top = document.createElement('div');
  top.className = 'card-top';
  const check = document.createElement('label');
  check.className = 'check';
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = !!t.done;
  cb.dataset.act = 'toggle-card';
  check.appendChild(cb);
  top.appendChild(check);
  top.appendChild(title);
  card.appendChild(top);

  if (s.total || t.images.length || t.examples.length){
    const foot = document.createElement('div');
    foot.className = 'card-foot';
    if (s.total){
      const bd = document.createElement('span');
      bd.className = 'badge';
      bd.innerHTML = ICON.check + ' <b>' + s.done + '/' + s.total + '</b>';
      foot.appendChild(bd);
    }
    if (t.images.length){
      const bd = document.createElement('span');
      bd.className = 'badge';
      bd.innerHTML = ICON.image + ' <b>' + t.images.length + '</b>';
      foot.appendChild(bd);
    }
    if (t.examples.length){
      const bd = document.createElement('span');
      bd.className = 'badge';
      bd.innerHTML = ICON.quote + ' <b>' + t.examples.length + '</b>';
      foot.appendChild(bd);
    }
    if (s.total){
      const bar = document.createElement('span');
      bar.className = 'mini-bar';
      bar.innerHTML = '<i style="width:' + pct + '%"></i>';
      foot.appendChild(bar);
    }
    card.appendChild(foot);
  }

  return card;
}

/* ======================= СОБЫТИЯ ДОСКИ ======================= */
function addList(){
  const b = board(); if (!b) return;
  const l = { id: uid('l'), title: 'Новый список', cards: [] };
  b.lists.push(l);
  save(); renderBoard(); renderSidebar();
  const input = $('.list[data-list="' + l.id + '"] .list-title');
  if (input){ input.focus(); input.select(); }
}

function showAddCardForm(listEl, listId){
  const existing = listEl.querySelector('.add-card-form');
  if (existing){ existing.querySelector('textarea').focus(); return; }
  const form = document.createElement('div');
  form.className = 'add-card-form';
  form.innerHTML = '<textarea rows="2" placeholder="Название задачи…"></textarea>' +
    '<div style="display:flex;gap:6px">' +
    '<button class="btn solid sm" data-f="ok">Добавить</button>' +
    '<button class="btn sm" data-f="cancel">Отмена</button></div>';
  const btn = listEl.querySelector('.add-card');
  listEl.insertBefore(form, btn);
  const ta = form.querySelector('textarea');
  ta.focus();
  const submit = () => {
    const v = ta.value.trim();
    if (!v){ form.remove(); return; }
    createTask({ listId: listId, title: v });
    renderBoard(); renderSidebar();
    const l2 = $('.list[data-list="' + listId + '"]');
    if (l2) showAddCardForm(l2, listId);
  };
  form.querySelector('[data-f="ok"]').addEventListener('click', submit);
  form.querySelector('[data-f="cancel"]').addEventListener('click', () => form.remove());
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); submit(); }
    if (e.key === 'Escape'){ form.remove(); }
  });
}

function bindBoardEvents(){
  const host = $('#board');

  host.addEventListener('click', e => {
    if (suppressClick){ e.preventDefault(); e.stopPropagation(); return; }
    const actionEl = e.target.closest('[data-act]');
    const cardEl = e.target.closest('.card');
    const listEl = e.target.closest('.list');

    if (actionEl && actionEl.dataset.act === 'del-list'){
      const b = board();
      const l = b && b.lists.find(x => x.id === listEl.dataset.list);
      if (!l) return;
      askConfirm({ title: 'Удалить список «' + l.title + '»?', text: 'Все задачи в нём будут удалены вместе с подзадачами.', danger: true, ok: 'Удалить' })
        .then(ok => {
          if (!ok) return;
          l.cards.slice().forEach(id => removeTask(id, true));
          b.lists = b.lists.filter(x => x.id !== l.id);
          save(); renderBoard(); renderSidebar();
          toast('Список удалён');
        });
      return;
    }

    if (actionEl && actionEl.dataset.act === 'add-card'){
      showAddCardForm(listEl, listEl.dataset.list);
      return;
    }

    if (e.target.closest('input, textarea, .drag-handle')) return;
    if (cardEl) openTask(cardEl.dataset.id);
  });

  host.addEventListener('change', e => {
    const cb = e.target.closest('input[type=checkbox][data-act="toggle-card"]');
    if (!cb) return;
    const id = cb.closest('.card').dataset.id;
    const t = T(id); if (!t) return;
    t.done = cb.checked; touch(t); save();
    renderBoard();
  });

  host.addEventListener('input', e => {
    const inp = e.target.closest('.list-title');
    if (!inp) return;
    const b = board(); if (!b) return;
    const l = b.lists.find(x => x.id === inp.closest('.list').dataset.list);
    if (!l) return;
    l.title = inp.value;
    save();
  });

}

function dragAfterList(container, x){
  const items = $$('.list:not(.dragging)', container);
  let closest = null, closestOffset = -Infinity;
  items.forEach(child => {
    const box = child.getBoundingClientRect();
    const offset = x - box.left - box.width / 2;
    if (offset < 0 && offset > closestOffset){ closestOffset = offset; closest = child; }
  });
  return closest;
}

/* ======================= РЕНДЕР: МОДАЛЬНОЕ ОКНО ЗАДАЧИ ======================= */
function crumbsHTML(t){
  const chain = ancestorsOf(t);
  if (!chain.length) return '<span style="color:var(--muted)">Задача верхнего уровня</span>';
  let html = '';
  chain.forEach(a => {
    html += '<button class="crumb" data-act="open-task" data-id="' + a.id + '" title="' + esc(a.title) + '">' + esc(a.title) + '</button><span class="crumb-sep">/</span>';
  });
  return html + '<span style="color:var(--muted)">' + esc(t.title) + '</span>';
}
