    '</div>' +

    '<div class="auth-msg" id="acMsg"></div>';
}

/* ---------- вкладка «Пользователи» ---------- */
function usersTabHTML(){
  if (currentUser.role !== 'admin'){
    return '<div class="prefs-hint" style="margin:16px 0">Управление пользователями доступно администратору.</div>';
  }
  var auth = readAuth();
  var rows = auth.users.map(function(u){
    var self = u.id === currentUser.id;
    return '<div class="urow" data-uid="' + esc(u.id) + '">' +
      '<div class="uinfo"><div class="uname">' + esc(u.name || u.login) +
        (self ? ' <span style="color:var(--muted);font-weight:400">(вы)</span>' : '') + '</div>' +
        '<div class="ulogin">@' + esc(u.login) + '</div></div>' +
      roleBadge(u.role) +
      '<div class="uacts">' +
        '<button class="btn sm" data-acc-act="user-reset" data-uid="' + esc(u.id) + '" title="Задать новый пароль">Пароль</button>' +
        (self ? '' : '<button class="btn sm" data-acc-act="user-role" data-uid="' + esc(u.id) + '" data-role="' +
          (u.role === 'admin' ? 'user' : 'admin') + '">' + (u.role === 'admin' ? 'Снять админа' : 'Админ') + '</button>') +
        (self ? '' : '<button class="btn sm danger" data-acc-act="user-del" data-uid="' + esc(u.id) + '" title="Удалить пользователя">✕</button>') +
      '</div></div>';
  }).join('');

  return '<div class="fx-col">' +
      '<div class="sec-title" style="margin:14px 0 6px">Пользователи · ' + auth.users.length + '</div>' +
      '<div class="ulist" id="userList">' + rows + '</div>' +
    '</div>' +
    '<div class="fx-col">' +
    '<div class="unew">' +
      '<div class="sec-title" style="margin:14px 0 8px">Новый пользователь</div>' +
      '<div class="field"><label for="nuLogin">Логин</label>' +
        '<input class="input" id="nuLogin" type="text" placeholder="например, anna" autocapitalize="none" spellcheck="false"></div>' +
      '<div class="field"><label for="nuName">Имя</label>' +
        '<input class="input" id="nuName" type="text" placeholder="как показывать в шапке"></div>' +
      '<div class="field"><label for="nuPass">Пароль</label>' +
        '<input class="input" id="nuPass" type="text" placeholder="минимум 6 символов" autocomplete="off"></div>' +
      '<button class="btn solid sm" data-acc-act="user-new">Создать пользователя</button>' +
      '<div class="prefs-hint" style="margin-top:8px">Пароль виден здесь, чтобы вы могли передать его человеку. ' +
        'Свои данные каждый пользователь хранит в своём браузере.</div>' +
    '</div></div>' +
    '<div class="auth-msg" id="acMsg"></div>';
}

function tabHTML(tab){
  if (tab === 'fx') return fxTabHTML();
  if (tab === 'account') return accountTabHTML();
  if (tab === 'users') return usersTabHTML();
  return lookTabHTML();
}

function settingsMsg(text, ok){
  var box = $('#acMsg');
  if (!box) return;
  box.textContent = text;
  box.classList.add('show');
  box.style.borderColor = ok ? 'var(--line-2)' : 'var(--danger)';
  try { box.scrollIntoView({ block: 'nearest' }); } catch (e){}
}

function renderSettings(){
  var host = $('#prefsHost');
  if (!host || !currentUser) return;

  /* запомнить прокрутку текущей вкладки, чтобы окно не дёргалось */
  var oldScreen = $('#prefsScreen');
  if (oldScreen){
    var oldBody = $('#settingsBody');
    var oldTab = oldScreen.getAttribute('data-tab') || 'look';
    if (oldBody) settingsScroll[oldTab] = oldBody.scrollTop;
  }

  var tabs = settingsTabs();
  var known = tabs.some(function(t){ return t[0] === settingsTab; });
  if (!known) settingsTab = 'look';

  host.innerHTML = '<div class="prefs" id="prefsScreen" data-tab="' + settingsTab + '"><div class="prefs-card">' +
    '<div class="prefs-head"><h3>Настройки</h3>' + roleBadge(currentUser.role) + '<span style="flex:1"></span>' +
      '<button class="icon-btn" data-prefs="close" title="Закрыть">✕</button></div>' +
    '<div class="prefs-tabs">' + tabs.map(function(t){
      return '<button data-settings-tab="' + t[0] + '" class="' + (t[0] === settingsTab ? 'on' : '') + '">' + t[1] + '</button>';
    }).join('') + '</div>' +
    '<div class="prefs-body" id="settingsBody">' + tabHTML(settingsTab) + '</div>' +
    '<div class="prefs-foot">' +
      (settingsTab === 'look' ? '<button class="btn sm" data-prefs="reset">Сбросить</button>' : '<span></span>') +
      '<button class="btn solid sm" data-prefs="close">Готово</button>' +
    '</div></div></div>';

  var screen = $('#prefsScreen');
  if (!screen) return;
  screen.addEventListener('click', settingsClick);
  screen.addEventListener('input', settingsInput);

  var newBody = $('#settingsBody');
  if (newBody) newBody.scrollTop = settingsScroll[settingsTab] || 0;

  var preview = $('#bgPreview');
  if (preview){
    preview.addEventListener('dragover', function(e){ e.preventDefault(); preview.classList.add('hot'); });
    preview.addEventListener('dragleave', function(){ preview.classList.remove('hot'); });
    preview.addEventListener('drop', function(e){
      e.preventDefault();
      preview.classList.remove('hot');
      var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f && /^image\//.test(f.type)) setBgImage(f);
    });
  }
}

function settingsClick(e){
  var screen = $('#prefsScreen');
  if (!screen) return;
  if (e.target === screen){ closeSettings(); return; }

  var tabBtn = e.target.closest('[data-settings-tab]');
  if (tabBtn){ settingsTab = tabBtn.getAttribute('data-settings-tab'); renderSettings(); return; }

  if (e.target.closest('[data-prefs="close"]')){ closeSettings(); return; }

  if (e.target.closest('[data-prefs="reset"]')){
    prefs = defaultPrefs();
    applyPrefs(); savePrefs(); renderSettings();
    toast('Настройки сброшены');
    return;
  }
  if (e.target.closest('[data-prefs="upload-bg"]')){ pickBgImage(); return; }
  if (e.target.closest('[data-prefs="clear-bg"]')){
    patchPrefs(function(p){ p.bg.image = ''; p.bg.imageName = ''; if (p.bg.mode === 'image') p.bg.mode = 'graphite'; });
    renderSettings();
    return;
  }
  if (e.target.closest('[data-prefs="test-fx"]')){ Fx.demo(); return; }

  var autoBtn = e.target.closest('[data-fxauto]');
  if (autoBtn){
    var ak = autoBtn.getAttribute('data-fxauto');
    patchPrefs(function(p){
      if (ak === 'particles') p.particles.color = 'auto';
      else p.click.color = 'auto';
    });
    renderSettings();
    return;
  }

  var t = e.target.closest('[data-set-theme]');
  if (t){ patchPrefs(function(p){ p.theme = t.getAttribute('data-set-theme'); }); renderSettings(); return; }

  var m = e.target.closest('[data-set-bgmode]');
  if (m){ patchPrefs(function(p){ p.bg.mode = m.getAttribute('data-set-bgmode'); }); renderSettings(); return; }

  var pi = e.target.closest('[data-set-pint]');
  if (pi){ patchPrefs(function(p){ p.particles.intensity = parseInt(pi.getAttribute('data-set-pint'), 10) || 2; }); renderSettings(); return; }

  var pt = e.target.closest('[data-set-ptype]');
  if (pt){ patchPrefs(function(p){ p.particles.type = pt.getAttribute('data-set-ptype'); }); renderSettings(); return; }

  var ct = e.target.closest('[data-set-ctype]');
  if (ct){ patchPrefs(function(p){ p.click.type = ct.getAttribute('data-set-ctype'); }); renderSettings(); return; }

  if (e.target.closest('#fxSwitch')){
    patchPrefs(function(p){ p.particles.enabled = !p.particles.enabled; });
    renderSettings();
    return;
  }

  var accBtn = e.target.closest('[data-acc-act]');
  if (accBtn){ accountAct(accBtn.getAttribute('data-acc-act'), accBtn); return; }
}

function settingsInput(e){
  var color = e.target.closest('[data-bgcolor]');
  if (color){
    var key = color.getAttribute('data-bgcolor');
    patchPrefs(function(p){ p.bg[key] = color.value; });
    return;
  }
  var fx = e.target.closest('[data-fxcolor]');
  if (fx){
    var fk = fx.getAttribute('data-fxcolor');
    patchPrefs(function(p){
      if (fk === 'particles') p.particles.color = fx.value;
      else p.click.color = fx.value;
    });
    var hint = fx.parentNode.querySelector('.prefs-hint');
    if (hint) hint.textContent = fx.value;
    var autoB = fx.parentNode.querySelector('[data-fxauto]');
    if (autoB) autoB.classList.remove('solid');
    return;
  }
  var range = e.target.closest('[data-range]');
  if (range){
    var rk = range.getAttribute('data-range');
    var val = parseInt(range.value, 10) || 0;
    patchPrefs(function(p){
      if (rk === 'angle') p.bg.angle = val;
      else if (rk === 'pspeed') p.particles.speed = Math.max(0.4, Math.min(2.4, parseFloat(range.value) || 1));
      else if (rk === 'csize') p.click.size = Math.max(1, Math.min(3, val));
      else p.bg[rk] = val;
    });
    var out = range.parentNode.querySelector('output');
    if (out){
      if (rk === 'blur') out.textContent = val + 'px';
      else if (rk === 'angle') out.textContent = val + '°';
      else if (rk === 'pspeed') out.textContent = (parseFloat(range.value) || 1).toFixed(1) + '×';
      else if (rk === 'csize') out.textContent = String(val);
      else out.textContent = val + '%';
    }
  }
}

/* ---------- действия аккаунта и пользователей ---------- */
function accountAct(act, btn){
  if (act === 'save-name'){
    var r = renameUser(currentUser.id, $('#acName').value);
    if (r.error){ settingsMsg(r.error); return; }
    currentUser.name = r.user.name;
    saveNow(); renderAccountChip(); renderSidebar();
    settingsMsg('Имя сохранено', true);
    toast('Имя обновлено');
    return;
  }

  if (act === 'save-pass'){
    var cur = $('#acCur').value, np = $('#acNew').value, np2 = $('#acNew2').value;
    if (np !== np2){ settingsMsg('Новые пароли не совпадают'); return; }
    var res = changePassword(currentUser.id, cur, np);
    if (res.error){ settingsMsg(res.error); return; }
    renderSettings();
    settingsMsg('Пароль изменён. Используйте его при следующем входе.', true);
    toast('Пароль изменён');
    return;
  }

  if (act === 'logout'){ signOut(); return; }

  if (act === 'reset'){
    askConfirm({
      title: 'Сбросить все данные аккаунта?',
      text: 'Доски, задачи и настройки оформления будут удалены и заменены демо-доской. Аккаунт и пароль останутся.',
      danger: true, ok: 'Сбросить'
    }).then(function(ok){
      if (!ok) return;
      state = { version: 2, activeBoard: null, boards: [], tasks: {} };
      openTaskId = null;
      seed();
      state.activeBoard = state.boards[0].id;
      saveNow();
      prefs = defaultPrefs();
      savePrefs();
      closeSettings();
      applyPrefs();
      renderAll();
      renderAccountChip();
      toast('Данные сброшены');
    });
    return;
  }

  if (act === 'user-new'){
    var nuLogin = $('#nuLogin').value, nuName = $('#nuName').value, nuPass = $('#nuPass').value;
    var nr = registerUser(nuName, nuLogin, nuPass);
    if (nr.error){ settingsMsg(nr.error); return; }
    renderSettings();
    settingsMsg('Пользователь @' + nr.user.login + ' создан. Пароль: ' + nuPass, true);
    toast('Пользователь @' + nr.user.login + ' создан');
    return;
  }

  if (act === 'user-reset'){
    var rUid = btn.getAttribute('data-uid');
    var rUser = null;
    readAuth().users.forEach(function(x){ if (x.id === rUid) rUser = x; });
    if (!rUser) return;
    askText({
      title: 'Новый пароль для @' + rUser.login,
      text: 'Текущий пароль знать не нужно — старый перестанет работать.',
      placeholder: 'минимум 6 символов', ok: 'Сохранить'
    }).then(function(pw){
      if (!pw) return;
      var rr = adminSetPassword(rUid, pw);
      if (rr.error){ toast(rr.error); return; }
      if (rUser.id === currentUser.id) currentUser.defaultPw = false;
      renderSettings();
      settingsMsg('Пароль @' + rUser.login + ' изменён на: ' + pw, true);
      toast('Пароль обновлён');
    });
    return;
  }

  if (act === 'user-role'){
    var roleUid = btn.getAttribute('data-uid'), roleNext = btn.getAttribute('data-role');
    var lr = setUserRole(roleUid, roleNext);
    if (lr.error){ settingsMsg(lr.error); return; }
    renderSettings();
    settingsMsg(roleNext === 'admin' ? 'Права администратора выданы' : 'Права администратора сняты', true);
    return;
  }

  if (act === 'user-del'){
    var dUid = btn.getAttribute('data-uid'), dUser = null;
    readAuth().users.forEach(function(x){ if (x.id === dUid) dUser = x; });
    if (!dUser) return;
    askConfirm({
      title: 'Удалить пользователя @' + dUser.login + '?',
      text: 'Вместе с аккаунтом удалятся его доски, задачи и настройки — в этом браузере.',
      danger: true, ok: 'Удалить'
    }).then(function(ok){
      if (!ok) return;
      var dr = removeUser(dUid);
      if (dr.error){ toast(dr.error); return; }
      renderSettings();
      settingsMsg('Пользователь @' + dUser.login + ' удалён', true);
      toast('Пользователь удалён');
    });
  }
}

/* ---------- фоновое изображение ---------- */
function pickBgImage(){
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.addEventListener('change', function(){
    var f = inp.files && inp.files[0];
    if (f) setBgImage(f);
  });
  inp.click();
}

function setBgImage(file){
  compressImage(file, 1800, 0.82).then(function(dataUrl){
    if (!dataUrl){ toast('Не удалось прочитать изображение'); return; }
    patchPrefs(function(p){
      p.bg.image = dataUrl;
      p.bg.imageName = file.name || 'фоновое изображение';
      p.bg.mode = 'image';
    });
    if ($('#prefsScreen')) renderSettings();
    toast('Фон обновлён', 2000);
  });
}

function compressImage(file, maxSide, quality){
  return new Promise(function(resolve){
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        try {
          var scale = Math.min(1, maxSide / Math.max(img.width, img.height));
          var canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          var out = canvas.toDataURL('image/jpeg', quality);
          if (out.length > 2600000) out = canvas.toDataURL('image/jpeg', 0.62);
          resolve(out);
        } catch (e){ resolve(String(reader.result)); }
      };
      img.onerror = function(){ resolve(String(reader.result)); };
      img.src = String(reader.result);
    };
    reader.onerror = function(){ resolve(''); };
    reader.readAsDataURL(file);
  });
}

/* ======================= РЕНДЕР ======================= */
function renderAll(){
  applyTheme();
  renderSidebar();
  renderBoard();
}

/* ======================= ЗАПУСК ПРИЛОЖЕНИЯ ======================= */
function enterApp(){
  loadPrefs();
  var ok = load();
  if (!ok || !state.boards.length){
    state = { version: 2, activeBoard: null, boards: [], tasks: {} };
    seed();
  }
  if (!state.activeBoard && state.boards[0]) state.activeBoard = state.boards[0].id;
  if (!appBound){ appBound = true; bindGlobal(); }
  applyPrefs();
  renderAll();
  renderAccountChip();
}

/* отладочный API для автотестов */
window.OmniBoard = {
  getUser: function(){ return currentUser; },
  getUsers: function(){ return readAuth().users.map(function(u){ return { id: u.id, login: u.login, name: u.name, role: u.role }; }); },
  getPrefs: function(){ return prefs; },
  getBoards: function(){ return JSON.parse(JSON.stringify(state.boards)); },
  getTasks: function(){ return JSON.parse(JSON.stringify(state.tasks)); },
  exportMarkdown: function(){ return exportMarkdown(); },
  sha256Hex: function(str){ return bytesToHex(sha256(utf8Bytes(str))); },
  pbkdf2Hex: pbkdf2Hex
};

/* ======================= СТАРТ ======================= */
(function start(){
  Fx.init();
  ensureDefaultAccount();
  var sess = readSession();
  if (sess){
    var found = null;
    readAuth().users.forEach(function(u){ if (u.id === sess.uid) found = u; });
    if (found){
      currentUser = { id: found.id, login: found.login, name: found.name, role: found.role === 'admin' ? 'admin' : 'user', defaultPw: !!found.defaultPw };
      enterApp();
      return;
    }
    clearSession();
  }
  loadPrefs();
  applyPrefs();
  showAuth();
})();

})();
