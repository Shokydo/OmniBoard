function autoGrow(el){
  if (!el) return;
  el.style.height = 'auto';
  el.style.height = Math.max(28, el.scrollHeight) + 'px';
}

/* ======================= СОБЫТИЯ МОДАЛЬНОГО ОКНА ======================= */
function syncEditor(ed){
  const t = T(ed.dataset.task);
  if (!t) return;
  t.desc = ed.innerHTML;
  touch(t);
  save();
}

function bindModalEvents(overlay){
  /* фокус в редакторе — не даём тулбару украсть выделение */
  overlay.addEventListener('mousedown', e => {
    if (e.target.closest('.toolbar')) e.preventDefault();
  });

  overlay.addEventListener('input', e => {
    const el = e.target;
    if (el.classList.contains('editor')){
      syncEditor(el);
      return;
    }
    if (el.classList.contains('node-title')){
      const t = T(el.dataset.id);
      if (t){ t.title = el.value; touch(t); save(); }
      return;
    }
    if (el.classList.contains('sheet-title')){
      const t = T(openTaskId);
      if (t){ t.title = el.value; touch(t); save(); }
      autoGrow(el);
      return;
    }
    if (el.hasAttribute('data-ex-title')){
      const t = T(el.dataset.task); if (!t) return;
      const ex = t.examples.find(x => x.id === el.getAttribute('data-ex-title'));
      if (ex){ ex.title = el.value; touch(t); save(); }
      return;
    }
    if (el.hasAttribute('data-ex-body')){
      const t = T(el.dataset.task); if (!t) return;
      const ex = t.examples.find(x => x.id === el.getAttribute('data-ex-body'));
      if (ex){ ex.body = el.value; touch(t); save(); }
    }
  });

  overlay.addEventListener('keydown', e => {
    const inp = e.target.closest('.node-title');
    if (!inp) return;
    const t = T(inp.dataset.id);
    if (!t) return;

    if (e.key === 'Enter'){
      e.preventDefault();
      const sib = insertAfterSibling(t);
      if (sib){ pendingFocus = sib.id; renderModal(); }
      return;
    }
    if (e.key === 'Tab'){
      e.preventDefault();
      const changed = e.shiftKey ? outdentTask(t) : indentTask(t);
      if (changed){ pendingFocus = t.id; renderModal(); renderBoard(); }
      return;
    }
    if (e.key === 'Backspace' && !inp.value){
      e.preventDefault();
      const parentId = t.parentId;
      if (!parentId) return;
      removeTask(t.id);
      pendingFocus = parentId;
      renderModal(); renderBoard();
    }
  });

  overlay.addEventListener('change', e => {
    const cb = e.target;
    if (!cb.matches('input[type=checkbox]')) return;
    if (cb.dataset.act === 'toggle-root'){
      const t = T(openTaskId); if (!t) return;
      t.done = cb.checked; touch(t); save();
      renderModal();
      return;
    }
    if (cb.dataset.act === 'toggle-tree'){
      const t = T(cb.dataset.id); if (!t) return;
      t.done = cb.checked; touch(t); save();
      renderModal();
    }
  });

  overlay.addEventListener('click', e => {
    const cmdEl = e.target.closest('[data-cmd]');
    if (cmdEl){ execCmd(cmdEl); return; }

    const actEl = e.target.closest('[data-act]');
    if (actEl){
      const act = actEl.dataset.act;
      const id = actEl.dataset.id;

      if (act === 'close'){ closeTask(); return; }

      if (act === 'toggle-node'){
        if (openNodes.has(id)) openNodes.delete(id); else openNodes.add(id);
        renderModal();
        return;
      }

      if (act === 'add-sub')
        { addSubtask(id || openTaskId); return; }

      if (act === 'open-task')
        { openTask(id); return; }

      if (act === 'del-task')
        { deleteTask(id || openTaskId); return; }

      if (act === 'pick-images'){
        pickImages(T(id || openTaskId));
        return;
      }

      if (act === 'del-image'){
        const t = T(actEl.dataset.task); if (!t) return;
        t.images = t.images.filter(x => x.id !== actEl.dataset.id);
        touch(t); save(); renderModal(); renderBoard();
        return;
      }

      if (act === 'zoom-image'){
        const img = actEl.closest('.shot').querySelector('img');
        openLightbox(img.src);
        return;
      }

      if (act === 'add-example'){
        const t = T(id || openTaskId); if (!t) return;
        const ex = { id: uid('ex'), title: 'Новый пример', body: '', mode: 'note' };
        t.examples.push(ex);
        touch(t); save(); renderModal();
        const inp = overlay.querySelector('[data-ex-title="' + ex.id + '"]');
        if (inp){ inp.focus(); inp.select(); }
        return;
      }

      if (act === 'del-example'){
        const t = T(actEl.dataset.task); if (!t) return;
        t.examples = t.examples.filter(x => x.id !== id);
        touch(t); save(); renderModal();
        return;
      }

      if (act === 'ex-mode'){
        const t = T(actEl.dataset.task); if (!t) return;
        const ex = t.examples.find(x => x.id === id);
        if (ex){ ex.mode = ex.mode === 'code' ? 'note' : 'code'; touch(t); save(); renderModal(); }
        return;
      }
    }

    if (e.target === overlay) closeTask();
  });

  /* вставка картинки из буфера прямо в текст */
  overlay.addEventListener('paste', e => {
    const ed = e.target.closest('.editor');
    if (!ed) return;
    const items = (e.clipboardData && e.clipboardData.items) || [];
    const files = [];
    for (let i = 0; i < items.length; i++){
      if (items[i].kind === 'file' && /^image\//.test(items[i].type)){
        const f = items[i].getAsFile();
        if (f) files.push(f);
      }
    }
    if (!files.length) return;
    e.preventDefault();
    readFiles(files).then(urls => {
      urls.forEach(u => document.execCommand('insertImage', false, u));
      syncEditor(ed);
    });
  });

  /* drag&drop изображений на зону */
  overlay.addEventListener('dragover', e => {
    const dz = e.target.closest('[data-drop="images"]');
    if (!dz) return;
    e.preventDefault();
    dz.classList.add('hot');
  });
  overlay.addEventListener('dragleave', e => {
    const dz = e.target.closest('[data-drop="images"]');
    if (dz) dz.classList.remove('hot');
  });
  overlay.addEventListener('drop', e => {
    const dz = e.target.closest('[data-drop="images"]');
    if (!dz) return;
    e.preventDefault();
    dz.classList.remove('hot');
    const files = Array.prototype.slice.call(e.dataTransfer.files || []).filter(f => /^image\//.test(f.type));
    if (!files.length) return;
    addImages(T(dz.dataset.task), files);
  });
}

function closeTask(){
  openTaskId = null;
  modalStack = [];
  openNodes.clear();
  $('#overlayHost').innerHTML = '';
  renderBoard();
  renderSidebar();
}

function openTask(id, opts){
  const t = T(id);
  if (!t) return;
  if (!opts || opts.push !== false){
    if (openTaskId && openTaskId !== id) modalStack.push(openTaskId);
  }
  openTaskId = id;
  /* раскрываем всё поддерево (с разумным лимитом) — вложенность видна сразу */
  var budget = { n: 0 };
  (function expand(node){
    if (budget.n++ > 400) return;
    openNodes.add(node.id);
    (node.subtasks || []).forEach(function(cid){ if (T(cid)) expand(T(cid)); });
  })(t);
  renderModal();
}

function insertAfterSibling(current){
  const parent = current.parentId ? T(current.parentId) : null;
  if (!parent) return null;                       /* корневая задача списка — соседа не создаём */
  const idx = parent.subtasks.indexOf(current.id);
  const t = createTask({ parentId: parent.id, title: 'Новая подзадача' });
  parent.subtasks = parent.subtasks.filter(x => x !== t.id);
  parent.subtasks.splice(clamp(idx + 1, 0, parent.subtasks.length), 0, t.id);
  openNodes.add(parent.id); openNodes.add(t.id);
  save();
  return t;
}

function indentTask(current){
  const parent = current.parentId ? T(current.parentId) : null;
  if (!parent) return false;
  const idx = parent.subtasks.indexOf(current.id);
  if (idx <= 0) return false;
  const prev = T(parent.subtasks[idx - 1]);
  if (!prev) return false;
  parent.subtasks.splice(idx, 1);
  prev.subtasks.push(current.id);
  current.parentId = prev.id;
  openNodes.add(prev.id); openNodes.add(current.id);
  touch(current); save();
  return true;
}

function outdentTask(current){
  const parent = current.parentId ? T(current.parentId) : null;
  if (!parent || !parent.parentId) return false;
  const grand = T(parent.parentId);
  if (!grand) return false;
  parent.subtasks = parent.subtasks.filter(x => x !== current.id);
  const idx = grand.subtasks.indexOf(parent.id);
  grand.subtasks.splice(idx + 1, 0, current.id);
  current.parentId = grand.id;
  openNodes.add(grand.id);
  touch(current); save();
  return true;
}

function addSubtask(parentId){
  const parent = T(parentId); if (!parent) return;
  openNodes.add(parent.id);
  const t = createTask({ parentId: parent.id, title: 'Новая подзадача' });
  openNodes.add(t.id);
  pendingFocus = t.id;
  renderModal();
  renderBoard();
}

function deleteTask(id){
  const t = T(id); if (!t) return;
  const s = stats(t);
  const isRootOpen = (id === openTaskId);
  const text = s.total
    ? 'Будут удалены все вложенные задачи: ' + (s.total) + ' шт.'
    : 'Задачу нельзя будет восстановить.';
  askConfirm({ title: 'Удалить «' + (t.title || 'без названия') + '»?', text: text, danger: true, ok: 'Удалить' })
    .then(ok => {
      if (!ok) return;
      const parentId = t.parentId;
      removeTask(id);
      if (isRootOpen){
        if (parentId && state.tasks[parentId] && T(parentId)){ openTaskId = parentId; renderModal(); }
        else closeTask();
      } else {
        renderModal();
      }
      renderBoard(); renderSidebar();
      toast('Удалено');
    });
}

/* ======================= РЕДАКТОР ======================= */
function execCmd(btn){
  const wrap = btn.closest('.editor-wrap');
  const ed = wrap.querySelector('.editor');
  const cmd = btn.dataset.cmd;
  ed.focus();

  const blocks = { h2: '<h2>', h3: '<h3>', p: '<p>', quote: '<blockquote>', pre: '<pre>' };
  if (blocks[cmd]){ document.execCommand('formatBlock', false, blocks[cmd]); syncEditor(ed); return; }
  if (cmd === 'bold' || cmd === 'italic' || cmd === 'underline' || cmd === 'strike'){
    const map = { bold: 'bold', italic: 'italic', underline: 'underline', strike: 'strikeThrough' };
    document.execCommand(map[cmd]); syncEditor(ed); return;
  }
  if (cmd === 'ul'){ document.execCommand('insertUnorderedList'); syncEditor(ed); return; }
  if (cmd === 'ol'){ document.execCommand('insertOrderedList'); syncEditor(ed); return; }
  if (cmd === 'hr'){ document.execCommand('insertHorizontalRule'); syncEditor(ed); return; }
  if (cmd === 'clear'){ document.execCommand('removeFormat'); document.execCommand('formatBlock', false, '<p>'); syncEditor(ed); return; }
  if (cmd === 'link'){
    askText({ title: 'Ссылка', placeholder: 'https://…', ok: 'Вставить' }).then(url => {
      if (!url) return;
      ed.focus();
      document.execCommand('createLink', false, url);
      syncEditor(ed);
    });
    return;
  }
  if (cmd === 'img'){
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true;
    inp.addEventListener('change', () => {
      readFiles(Array.prototype.slice.call(inp.files || [])).then(urls => {
        ed.focus();
        urls.forEach(u => document.execCommand('insertImage', false, u));
        syncEditor(ed);
      });
    });
    inp.click();
  }
}

function readFiles(files){
  return Promise.all(files.map(f => new Promise(res => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => res(null);
    r.readAsDataURL(f);
  }))).then(list => list.filter(Boolean));
}

function pickImages(t){
  if (!t) return;
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true;
  inp.addEventListener('change', () => addImages(t, Array.prototype.slice.call(inp.files || [])));
  inp.click();
}

function addImages(t, files){
  if (!t || !files.length) return;
  readFiles(files).then(urls => {
    urls.forEach((src, i) => t.images.push({ id: uid('img'), src: src, name: (files[i] && files[i].name) || 'image' }));
    touch(t); save();
    if (openTaskId) renderModal();
    renderBoard();
    toast('Добавлено изображений: ' + urls.length);
  });
}

function openLightbox(src){
  const host = $('#dialogHost');
  host.innerHTML = '<div class="lightbox"><button class="close" data-x="1">✕</button><img src="' + src + '" alt=""></div>';
  host.querySelector('.lightbox').addEventListener('click', e => {
    if (e.target.classList.contains('lightbox') || e.target.dataset.x) closeDialog();
  });
}

/* ======================= ЭКСПОРТ / ИМПОРТ (JSON И MARKDOWN) ======================= */
function downloadText(name, mime, text){
  try {
    var blob = new Blob([text], { type: mime });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
    toast('Файл сохранён');
    return true;
  } catch (e){
    toast('Скачивание заблокировано — используйте «Копировать»');
    return false;
  }
}

function copyText(text){
  var area = document.createElement('textarea');
  area.value = text;
  area.style.position = 'fixed';
  area.style.opacity = '0';
  document.body.appendChild(area);
  area.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (e){ ok = false; }
  area.remove();
  if (ok){ toast('Скопировано'); return; }
  if (navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){ toast('Скопировано'); },
      function(){ toast('Не удалось скопировать — выделите текст вручную'); });
  } else {
    toast('Не удалось скопировать — выделите текст вручную');
  }
}

/* ---------- Markdown → доски ---------- */
function mdPlain(s){
  return String(s || '').replace(/`/g, '').replace(/^\s*[*_]{1,3}(.*?)[*_]{1,3}\s*$/, '$1').trim();
}

function parseMarkdown(md, fallbackTitle){
  var lines = String(md || '').replace(/\r\n?/g, '\n').split('\n');
  var boards = [], tasks = {};
  var curBoard = null, curList = null, stack = [], last = null;
  var fence = null, fenceLines = [], pendingEx = null, fenceIndent = 0;

  function ensureBoard(title){
    curBoard = { id: uid('b'), title: mdPlain(title) || fallbackTitle || 'Импорт из Markdown', created: nowISO(), lists: [] };
    boards.push(curBoard);
    curList = null; stack = []; last = null;
    return curBoard;
  }
  function ensureList(title){
    if (!curBoard) ensureBoard(fallbackTitle);
    curList = { id: uid('l'), title: mdPlain(title) || 'Задачи', cards: [] };
    curBoard.lists.push(curList);
    stack = []; last = null;
    return curList;
  }
  function makeTask(title, done, parent){
    var t = {
      id: uid('t'), title: title, desc: '', done: !!done,
      images: [], examples: [], subtasks: [], parentId: parent ? parent.id : null,
      created: nowISO(), updated: nowISO()
    };
    tasks[t.id] = t;
    if (parent) parent.subtasks.push(t.id);
    return t;
  }
  function addCard(title, done, depth){
    var nm = mdPlain(title);
    if (!nm) return null;
    if (!curList) ensureList('Задачи');
    var d = Math.max(0, Math.min(depth | 0, stack.length));
    var t;
    if (d === 0 || !stack.length){
      t = makeTask(nm, done, null);
      curList.cards.push(t.id);
      stack = [t];
    } else {
      t = makeTask(nm, done, stack[d - 1]);
      stack = stack.slice(0, d);
      stack.push(t);
    }
    last = t;
    return t;
  }
  function pushDesc(html){
    if (!last) return;
    last.desc = last.desc ? last.desc + '<br>' + html : html;
  }

  for (var i = 0; i < lines.length; i++){
    var raw = lines[i];
    var line = raw.replace(/\s+$/, '');

    /* блоки кода внутри пункта — в описание задачи */
    var fenceOpen = /^(\s*)(```|~~~)/.exec(line);
    var fenceMatch = !!fenceOpen;
    if (fence !== null){
      if (fenceMatch){
        var code = fenceLines.join('\n');
        if (last && last.examples){
          last.examples.push({ id: uid('ex'), title: pendingEx || 'Код из Markdown', body: code, mode: 'code' });
        } else if (last){
          pushDesc('<pre>' + esc(code) + '</pre>');
        }
        pendingEx = null; fence = null; fenceLines = [];
      }
      else fenceLines.push(raw.replace(new RegExp('^[ \\t]{0,' + fenceIndent + '}'), ''));
      continue;
    }
    if (fenceMatch){ fence = '```'; fenceLines = []; fenceIndent = fenceOpen[1].replace(/\t/g, '  ').length; continue; }

    if (!line.trim()) continue;
    /* служебный курсив: «_12 задач, выполнено 3_», «_пусто_» */
    if (/^_[^_].*_$/.test(line.trim())) continue;

    var h1 = /^#\s+(.*)$/.exec(line);
    if (h1){ ensureBoard(h1[1]); continue; }
    var h2 = /^##\s+(.*)$/.exec(line);
    if (h2){ ensureList(h2[1]); continue; }
    var h3 = /^###+\s+(.*)$/.exec(line);
    if (h3){ addCard(h3[1], false, 0); continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) continue;   /* горизонтальная линия */

    var bullet = /^(\s*)[-*+]\s+(.*)$/.exec(line);
    if (bullet){
      var indent = bullet[1].replace(/\t/g, '  ').length;
      var body = bullet[2];
      var done = false;
      var box = /^\[( |x|X)\]\s*(.*)$/.exec(body);
      if (box){ done = box[1].toLowerCase() === 'x'; body = box[2]; }
      addCard(body, done, Math.floor(indent / 2));
      continue;
    }

    var quote = /^(\s*)>\s?(.*)$/.exec(line);
    if (quote){
      var qText = mdPlain(quote[2]);
      var exTag = /^пример\s*:\s*(.*)$/i.exec(qText);
      if (exTag){ pendingEx = exTag[1] || 'Пример'; continue; }
      if (/^изображений\s*:/i.test(qText)) continue;
      var qd = Math.floor(quote[1].replace(/\t/g, '  ').length / 2);
      var target = (qd > 0 && stack[qd - 1]) ? stack[qd - 1] : last;
      if (target){
        var html = esc(mdPlain(quote[2]));
        target.desc = target.desc ? target.desc + '<br>' + html : html;
        last = target;
      }
      continue;
    }

    var ordered = /^\s*\d+[.)]\s+(.*)$/.exec(line);
    if (ordered){ addCard(ordered[1], false, 0); continue; }

    /* обычный текст под пунктом — описание, иначе заголовок карточки */
    if (last) pushDesc(esc(line.trim()));
    else addCard(line.trim(), false, 0);
  }
  if (fence !== null && fenceLines.length) pushDesc('<pre>' + esc(fenceLines.join('\n')) + '</pre>');

  /* доска без заголовка, но с задачами */
  if (!boards.length && Object.keys(tasks).length) ensureBoard(fallbackTitle);

  return { boards: boards, tasks: tasks };
}

/* ---------- доски → Markdown ---------- */
function mdText(html){
  if (!html) return '';
  var flat = String(html)
    .replace(/<\s*br\s*\/?>/gi, '\n')
    .replace(/<\/(p|div|li|pre|h[1-6]|blockquote)>/gi, '\n')
    .replace(/<li[^>]*>/gi, '- ')
    .replace(/<[^>]+>/g, '');
  var ta = document.createElement('textarea');
  ta.innerHTML = flat;                    /* раскодирует &amp; и прочие сущности */
  return String(ta.value || '').replace(/\u00a0/g, ' ').replace(/\n{3,}/g, '\n\n');
}

function cardToMarkdown(id, depth){
  var t = state.tasks[id];
  if (!t) return '';
  var pad = new Array(depth + 1).join('  ');
  var out = pad + '- [' + (t.done ? 'x' : ' ') + '] ' + String(t.title || '').replace(/\n+/g, ' ').trim() + '\n';

  var desc = mdText(t.desc).split('\n');
  for (var j = 0; j < desc.length; j++){
    var line = desc[j].replace(/\s+$/, '');
    if (!line.trim()) continue;
    out += pad + '  > ' + line + '\n';
  }

  (t.examples || []).forEach(function(ex){
    out += pad + '  > пример: ' + String(ex.title || 'код').replace(/\n/g, ' ') + '\n';
    out += pad + '  ```\n';
    String(ex.body || '').split('\n').forEach(function(l){ out += pad + '  ' + l + '\n'; });
    out += pad + '  ```\n';
  });

  if ((t.images || []).length){
    out += pad + '  > изображений: ' + t.images.length + '\n';
  }

  var subs = t.subtasks || [];
  for (var i = 0; i < subs.length; i++) out += cardToMarkdown(subs[i], depth + 1);

  return out;
}

function boardToMarkdown(b){
  var total = 0, done = 0;
  function walk(id){
    var t = state.tasks[id]; if (!t) return;
    total++; if (t.done) done++;
    (t.subtasks || []).forEach(walk);
  }
  b.lists.forEach(function(l){ l.cards.forEach(walk); });

  var out = '# ' + String(b.title || 'Без названия') + '\n\n';
  out += '_' + total + ' ' + plural(total, ['задача', 'задачи', 'задач']) + ', выполнено ' + done +
    ' · ' + b.lists.length + ' ' + plural(b.lists.length, ['колонка', 'колонки', 'колонок']) + '_\n\n';

  b.lists.forEach(function(l){
    out += '## ' + String(l.title || 'Колонка') + '\n\n';
    if (!l.cards.length) out += '_пусто_\n\n';
    l.cards.forEach(function(id){
      var t = state.tasks[id];
      if (!t) return;
      out += cardToMarkdown(id, 0);
    });
    out += '\n';
  });
  return out;
}

function exportMarkdown(){
  if (!state.boards.length) return '';
  return state.boards.map(boardToMarkdown).join('\n---\n\n');
}

function importMarkdown(text, replace, fileName){
  var parsed = parseMarkdown(text, fileName ? String(fileName).replace(/\.(md|markdown|txt)$/i, '') : 'Импорт из Markdown');
  var taskCount = Object.keys(parsed.tasks).length;
  if (!parsed.boards.length || !taskCount) return { error: 'В файле не нашлось ни одной задачи' };

  if (replace){
    state.boards = parsed.boards;
    state.tasks = parsed.tasks;
  } else {
    parsed.boards.forEach(function(b){ state.boards.push(b); });
    Object.keys(parsed.tasks).forEach(function(id){ state.tasks[id] = parsed.tasks[id]; });
  }
  state.activeBoard = parsed.boards[0].id;
  saveNow();
  renderSidebar();
  renderBoard();
  return { boards: parsed.boards.length, tasks: taskCount };
}

        '<button class="btn" data-io="download">Скачать .json</button>' +

      '<div class="dialog-actions" style="margin-top:12px;flex-wrap:wrap">' +
        '<button class="btn" data-io="md-file">Выбрать .md</button>' +
        '<button class="btn" data-io="md-copy">Копировать</button>' +
        '<button class="btn" data-io="md-download">Скачать .md</button>' +
        '<button class="btn solid" data-io="md-import">Импортировать</button>' +
      '</div>' +
      '<label class="checkline" style="margin-top:10px"><input type="checkbox" id="mdReplace"> заменить все доски, а не добавлять</label>' +
      '<input type="file" id="mdFile" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>' +
    '</div>' +

    '<div class="dialog-actions" style="margin-top:12px">' +
      '<button class="btn" data-io="close">Закрыть</button>' +
    '</div>' +
  '</div></div>';

  var area = $('#ioArea');
  var mdArea = $('#mdArea');
  if (area) area.value = json;
  if (mdArea) mdArea.value = md;

  var card = host.querySelector('.dialog');
  card.addEventListener('click', function(e){
    var tabBtn = e.target.closest('[data-io-tab]');
    if (tabBtn){
      current = tabBtn.getAttribute('data-io-tab');
      $$('[data-io-tab]', card).forEach(function(b){ b.classList.toggle('on', b === tabBtn); });
      $$('[data-io-pane]', card).forEach(function(p){ p.hidden = p.getAttribute('data-io-pane') !== current; });
      return;
    }

    var b = e.target.closest('[data-io]');
    if (!b){
      if (e.target.classList.contains('dialog')) closeDialog();
      return;
    }
    var act = b.getAttribute('data-io');

    if (act === 'close'){ closeDialog(); return; }

    /* --- JSON --- */
    if (act === 'copy'){ copyText(area.value); return; }
    if (act === 'download'){ downloadText('omniboard-backup.json', 'application/json', area.value); return; }
    if (act === 'import'){
      var data;
      try { data = JSON.parse(area.value); } catch (_){ toast('Ошибка: некорректный JSON'); return; }
      if (!data || !Array.isArray(data.boards) || typeof data.tasks !== 'object'){ toast('Ошибка: не тот формат файла'); return; }
      askConfirm({ title: 'Заменить все данные?', text: 'Текущие доски и задачи будут потеряны.', danger: true, ok: 'Импортировать' })
        .then(function(ok){
          if (!ok) return;
          state.boards = data.boards;
          state.tasks = data.tasks;
          state.activeBoard = data.activeBoard || (data.boards[0] && data.boards[0].id) || null;
          if (data.prefs && typeof data.prefs === 'object'){
            if (data.prefs.theme === 'light' || data.prefs.theme === 'dark') prefs.theme = data.prefs.theme;
            if (data.prefs.bg) Object.keys(prefs.bg).forEach(function(k){ if (data.prefs.bg[k] !== undefined) prefs.bg[k] = data.prefs.bg[k]; });
            if (data.prefs.particles) Object.keys(prefs.particles).forEach(function(k){ if (data.prefs.particles[k] !== undefined) prefs.particles[k] = data.prefs.particles[k]; });
            if (data.prefs.click) Object.keys(prefs.click).forEach(function(k){ if (data.prefs.click[k] !== undefined) prefs.click[k] = data.prefs.click[k]; });
            if (data.prefs.snow && !data.prefs.particles){
              if (data.prefs.snow.enabled !== undefined) prefs.particles.enabled = !!data.prefs.snow.enabled;
              if (data.prefs.snow.intensity !== undefined) prefs.particles.intensity = clamp(parseInt(data.prefs.snow.intensity, 10) || 2, 1, 3);
            }
            savePrefs(); applyPrefs();
          }
          Object.keys(state.tasks).forEach(function(id){
            var t = state.tasks[id];
            t.images = t.images || []; t.examples = t.examples || [];
            t.subtasks = Array.isArray(t.subtasks) ? t.subtasks.filter(function(x){ return state.tasks[x]; }) : [];
          });
          saveNow(); renderSidebar(); renderBoard();
          closeDialog();
          toast('Импортировано');
        });
      return;
    }

    /* --- Markdown --- */
    if (act === 'md-copy'){ copyText(mdArea.value); return; }
    if (act === 'md-download'){ downloadText('omniboard-boards.md', 'text/markdown', mdArea.value); return; }

    if (act === 'md-file'){
      var fileInput = $('#mdFile');
      if (fileInput) fileInput.click();
      return;
    }

    if (act === 'md-import'){
      var replace = !!($('#mdReplace') && $('#mdReplace').checked);
      var run = function(){
        var res = importMarkdown(mdArea.value, replace, 'Импорт из Markdown');
        if (res.error){ toast(res.error); return; }
        closeDialog();
        toast('Импортировано: ' + res.boards + ' ' + plural(res.boards, ['доска', 'доски', 'досок']) +
          ' · ' + res.tasks + ' ' + plural(res.tasks, ['задача', 'задачи', 'задач']), 4000);
      };
      if (replace){
        askConfirm({ title: 'Заменить все доски?', text: 'Текущие доски и задачи будут потеряны.', danger: true, ok: 'Заменить' })
          .then(function(ok){ if (ok) run(); });
      } else {
        run();
      }
      return;
    }
  });

  var fileInput = $('#mdFile');
  if (fileInput){
    fileInput.addEventListener('change', function(){
      var f = fileInput.files && fileInput.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function(){
        mdArea.value = String(reader.result || '');
        toast('Файл загружен — нажмите «Импортировать»', 3500);
      };
      reader.onerror = function(){ toast('Не удалось прочитать файл'); };
      reader.readAsText(f, 'utf-8');
    });
  }
}

  $('#scrim').classList.toggle('show', !!open && window.innerWidth <= 900);
}

function bindGlobal(){
  $('#prefsBtn').addEventListener('click', function(){ closeAccountMenu(); openPrefs(); });
  $('#userChip').addEventListener('click', function(e){
    e.stopPropagation();
    if (!currentUser) return;
    toggleAccountMenu(e.currentTarget);
  });
  document.addEventListener('click', function(e){
    if (!e.target.closest('#accountMenu') && !e.target.closest('#userChip')) closeAccountMenu();
  });

  $('#exportBtn').addEventListener('click', function(){ ioDialog('json'); });

  $('#newBoardBtn').addEventListener('click', () => {
    askText({ title: 'Новая доска', placeholder: 'Например: Маркетинг', ok: 'Создать' }).then(title => {
      if (!title) return;
      const b = { id: uid('b'), title: title, created: nowISO(), lists: [
        { id: uid('l'), title: 'Бэклог', cards: [] },
        { id: uid('l'), title: 'В работе', cards: [] },
        { id: uid('l'), title: 'Готово', cards: [] }
      ]};
      state.boards.push(b);
      state.activeBoard = b.id;
      save(); renderSidebar(); renderBoard();
      toast('Доска создана');
    });
  });

  $('#addListTop').addEventListener('click', addList);

  $('#hambBtn').addEventListener('click', () => setSidebar(!$('#sidebar').classList.contains('open')));
  $('#scrim').addEventListener('click', () => setSidebar(false));

  document.addEventListener('click', e => {
    if (window.innerWidth > 900) return;
    const sb = $('#sidebar');
    if (sb.classList.contains('open') && !sb.contains(e.target) && !e.target.closest('#hambBtn')) setSidebar(false);
  });

  $('#boardList').addEventListener('click', e => {
    const del = e.target.closest('[data-act="del-board"]');
    const row = e.target.closest('[data-board]');
    if (!row) return;
    const b = state.boards.find(x => x.id === row.dataset.board);
    if (!b) return;
    if (del){
      askConfirm({ title: 'Удалить доску «' + b.title + '»?', text: 'Все списки и задачи доски будут удалены.', danger: true, ok: 'Удалить' })
        .then(ok => {
          if (!ok) return;
          b.lists.forEach(l => l.cards.slice().forEach(id => removeTask(id, true)));
          state.boards = state.boards.filter(x => x.id !== b.id);
          if (state.activeBoard === b.id) state.activeBoard = state.boards[0] ? state.boards[0].id : null;
          save(); renderSidebar(); renderBoard();
          toast('Доска удалена');
        });
      return;
    }
    if (state.activeBoard !== b.id){
      state.activeBoard = b.id;
      searchQuery = ''; $('#searchInput').value = '';
      save(); renderSidebar(); renderBoard();
      setSidebar(false);
    }
  });

  $('#boardName').addEventListener('input', e => {
    const b = board(); if (!b) return;
    b.title = e.target.value;
    save();
    renderSidebar();
  });

  $('#searchInput').addEventListener('input', debounce(e => {
    searchQuery = e.target.value;
    renderBoard();
  }, 140));

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape'){
      if ($('#accountMenu')){ closeAccountMenu(); return; }
      const prefsHost = $('#prefsHost');
      if (prefsHost && prefsHost.innerHTML){ prefsHost.innerHTML = ''; return; }
      const host = $('#dialogHost');
      if (host.innerHTML){ closeDialog(); return; }
      if (openTaskId){ closeTask(); }
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
      e.preventDefault();
      const s = $('#searchInput');
      if (s) s.focus();
    }
  });

  bindBoardEvents();

  document.addEventListener('pointerdown', onPointerDown, true);
  window.addEventListener('touchmove', function(e){
    if (pdrag && pdrag.active && e.cancelable) e.preventDefault();
  }, { passive: false });
}

var K256 = [

  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,

  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
];

function rotr(x, n){ return (x >>> n) | (x << (32 - n)); }

function sha256(bytes){
  var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var l = bytes.length;
  var total = (((l + 9) + 63) >> 6) << 6;
  var buf = new Uint8Array(total);
  buf.set(bytes);
  buf[l] = 0x80;
  var bits = l * 8;
  var hi = Math.floor(bits / 4294967296), lo = bits >>> 0;
  buf[total - 8] = (hi >>> 24) & 255; buf[total - 7] = (hi >>> 16) & 255;
  buf[total - 6] = (hi >>> 8) & 255;  buf[total - 5] = hi & 255;
  buf[total - 4] = (lo >>> 24) & 255; buf[total - 3] = (lo >>> 16) & 255;
  buf[total - 2] = (lo >>> 8) & 255;  buf[total - 1] = lo & 255;

  var w = new Int32Array(64);
  for (var i = 0; i < total; i += 64){
    for (var j = 0; j < 16; j++){
      w[j] = (buf[i + j*4] << 24) | (buf[i + j*4 + 1] << 16) | (buf[i + j*4 + 2] << 8) | buf[i + j*4 + 3];
    }
    for (j = 16; j < 64; j++){
      var s0 = rotr(w[j-15], 7) ^ rotr(w[j-15], 18) ^ (w[j-15] >>> 3);
      var s1 = rotr(w[j-2], 17) ^ rotr(w[j-2], 19) ^ (w[j-2] >>> 10);
      w[j] = (w[j-16] + s0 + w[j-7] + s1) | 0;
    }
    var a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
    for (j = 0; j < 64; j++){
      var S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
      var ch = (e & f) ^ (~e & g);
      var t1 = (h + S1 + ch + K256[j] + w[j]) | 0;
      var S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
      var maj = (a & b) ^ (a & c) ^ (b & c);
      var t2 = (S0 + maj) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
    H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
  }
  var out = new Uint8Array(32);
  for (i = 0; i < 8; i++){
    out[i*4] = (H[i] >>> 24) & 255; out[i*4+1] = (H[i] >>> 16) & 255;
    out[i*4+2] = (H[i] >>> 8) & 255; out[i*4+3] = H[i] & 255;
  }
  return out;
}

function utf8Bytes(str){
  if (window.TextEncoder) return new TextEncoder().encode(str);
  var s = unescape(encodeURIComponent(str)), out = new Uint8Array(s.length);
  for (var i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
  return out;
}

function concatBytes(a, b){
  var out = new Uint8Array(a.length + b.length);
  out.set(a); out.set(b, a.length);
  return out;
}

function bytesToHex(b){
  var s = '';
  for (var i = 0; i < b.length; i++) s += (b[i] < 16 ? '0' : '') + b[i].toString(16);
  return s;
}

function hexToBytes(hex){
  var out = new Uint8Array(hex.length / 2);
  for (var i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i*2, 2), 16);
  return out;
}

function hmacSha256(keyBytes, msgBytes){
  var block = 64;
  var k = keyBytes.length > block ? sha256(keyBytes) : keyBytes;
  var pad = new Uint8Array(block);
  pad.set(k);
  var ipad = new Uint8Array(block), opad = new Uint8Array(block);
  for (var i = 0; i < block; i++){ ipad[i] = pad[i] ^ 0x36; opad[i] = pad[i] ^ 0x5c; }
  return sha256(concatBytes(opad, sha256(concatBytes(ipad, msgBytes))));
}

var PBKDF2_ITER = 12000;

function pbkdf2Hex(password, saltHex, iterations){
  var pw = utf8Bytes(password);
  var salt = hexToBytes(saltHex);
  var msg = concatBytes(salt, new Uint8Array([0, 0, 0, 1]));
  var u = hmacSha256(pw, msg);
  var t = u.slice(0);
  for (var i = 1; i < iterations; i++){
    u = hmacSha256(pw, u);
    for (var j = 0; j < t.length; j++) t[j] ^= u[j];
  }
  return bytesToHex(t);
}

function randomHex(len){
  var bytes = new Uint8Array(len);
  if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(bytes);
  else for (var i = 0; i < len; i++) bytes[i] = Math.floor(Math.random() * 256);
  return bytesToHex(bytes);
}

/* ======================= АККАУНТЫ ======================= */
const LS_AUTH = 'omniboard.auth.v1';
const LS_SESSION = 'omniboard.session.v1';
const LS_PREFIX_DATA = 'omniboard.data.';
const LS_PREFIX_PREFS = 'omniboard.prefs.';

let currentUser = null;
let prefs = null;
let appBound = false;

const DEFAULT_PREFS = {
  theme: 'dark',
  bg: { mode: 'graphite', color: '#161a1d', gradA: '#23272b', gradB: '#0b0c0e', angle: 160, image: '', imageName: '', dim: 45, blur: 8 },
  particles: { enabled: true, type: 'snow', intensity: 2, color: 'auto', speed: 1 },
  click: { type: 'off', color: 'auto', size: 1 }
};

function defaultPrefs(){ return JSON.parse(JSON.stringify(DEFAULT_PREFS)); }
function dataKey(){ return LS_PREFIX_DATA + (currentUser ? currentUser.id : 'anon'); }
function prefsKey(){ return LS_PREFIX_PREFS + (currentUser ? currentUser.id : 'anon'); }

var memStore = {};
function lsGet(k){
  try { var v = localStorage.getItem(k); if (v !== null) return v; } catch (e){}
  return Object.prototype.hasOwnProperty.call(memStore, k) ? memStore[k] : null;
}
function lsSet(k, v){
  memStore[k] = v;
  try { localStorage.setItem(k, v); return true; } catch (e){ return false; }
}
function lsDel(k){
  delete memStore[k];
  try { localStorage.removeItem(k); } catch (e){}
}

function readAuth(){
  var auth;
  try {
    var d = JSON.parse(lsGet(LS_AUTH) || '{}');
    auth = (d && Array.isArray(d.users)) ? d : { users: [] };
  } catch (e){ auth = { users: [] }; }
  /* миграция: у старых записей нет роли — владелец аккаунта становится админом */
  var dirty = false;
  auth.users.forEach(function(u){
    if (u.role !== 'admin' && u.role !== 'user'){
      u.role = (u.login === DEFAULT_LOGIN) ? 'admin' : 'user';
      dirty = true;
    }
  });
  if (dirty) writeAuth(auth);
  return auth;
}
function writeAuth(a){ return lsSet(LS_AUTH, JSON.stringify(a)); }

function validateLogin(login){
  if (!login) return 'Укажите логин';
  if (login.length < 3) return 'Логин короче 3 символов';
  if (login.length > 40) return 'Логин длиннее 40 символов';
  if (!/^[a-z0-9._@-]+$/.test(login)) return 'В логине допустимы латиница, цифры и символы . _ - @';
  return '';
}
function validatePassword(pw){
  if (!pw || pw.length < 6) return 'Пароль должен быть не короче 6 символов';
  if (pw.length > 200) return 'Слишком длинный пароль';
  return '';
}

var DEFAULT_LOGIN = 'shokydo';
var DEFAULT_NAME = 'Shokydo';
var DEFAULT_PASSWORD = 'omniboard';

function buildUser(name, login, password, opts){
  opts = opts || {};
  var salt = randomHex(16);
  return {
    id: 'u_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    login: login, name: name, salt: salt, iter: PBKDF2_ITER,
    hash: pbkdf2Hex(password, salt, PBKDF2_ITER),
    role: opts.role === 'admin' ? 'admin' : 'user',
    defaultPw: !!opts.defaultPw,
    created: nowISO(), lastLogin: nowISO()
  };
}

/* аккаунт создаётся один раз при первом запуске — регистрации в интерфейсе нет */
function ensureDefaultAccount(){
  var auth = readAuth();
  if (auth.users.length) return false;
  auth.users.push(buildUser(DEFAULT_NAME, DEFAULT_LOGIN, DEFAULT_PASSWORD, { role: 'admin', defaultPw: true }));
  writeAuth(auth);
  return true;
}

function findUserById(uid){
  var auth = readAuth(), found = null;
  auth.users.forEach(function(u){ if (u.id === uid) found = u; });
  return found;
}

function registerUser(name, loginRaw, password, opts){
  var login = String(loginRaw || '').trim().toLowerCase();
  var nm = String(name || '').trim() || login;
  var err = validateLogin(login) || validatePassword(password);
  if (err) return { error: err };
  var auth = readAuth();
  if (auth.users.some(function(u){ return u.login === login; })) return { error: 'Такой логин уже зарегистрирован' };
  var user = buildUser(nm, login, password, { role: opts && opts.role === 'admin' ? 'admin' : 'user' });
  auth.users.push(user);
  if (!writeAuth(auth)) return { error: 'Браузер не разрешает сохранить данные (хранилище недоступно)' };
  return { user: user };
}

function loginUser(loginRaw, password){
  var login = String(loginRaw || '').trim().toLowerCase();
  var auth = readAuth();
  var u = null;
  for (var i = 0; i < auth.users.length; i++) if (auth.users[i].login === login) u = auth.users[i];
  if (!u){
    pbkdf2Hex(password || 'x', 'a1b2c3d4', 300);   /* выравниваем время ответа */
    return { error: 'Неверный логин или пароль' };
  }
  var hash = pbkdf2Hex(password || '', u.salt, u.iter || PBKDF2_ITER);
  if (hash !== u.hash) return { error: 'Неверный логин или пароль' };
  u.lastLogin = nowISO();
  writeAuth(auth);
  return { user: u };
}

function changePassword(uid, currentPassword, newPassword){
  var auth = readAuth();
  var u = null;
  for (var i = 0; i < auth.users.length; i++) if (auth.users[i].id === uid) u = auth.users[i];
  if (!u) return { error: 'Аккаунт не найден' };
  if (pbkdf2Hex(currentPassword || '', u.salt, u.iter || PBKDF2_ITER) !== u.hash) return { error: 'Текущий пароль неверен' };
  var err = validatePassword(newPassword);
  if (err) return { error: err };
  u.salt = randomHex(16);
  u.iter = PBKDF2_ITER;
  u.hash = pbkdf2Hex(newPassword, u.salt, PBKDF2_ITER);
  u.defaultPw = false;
  u.pwChangedAt = nowISO();
  if (!writeAuth(auth)) return { error: 'Не удалось сохранить пароль' };
  return { user: u };
}

function renameUser(uid, name){
  var nm = String(name || '').trim();
  if (!nm) return { error: 'Имя не может быть пустым' };
  if (nm.length > 40) return { error: 'Слишком длинное имя' };
  var auth = readAuth();
  var u = null;
  for (var i = 0; i < auth.users.length; i++) if (auth.users[i].id === uid) u = auth.users[i];
  if (!u) return { error: 'Аккаунт не найден' };
  u.name = nm;
  if (!writeAuth(auth)) return { error: 'Не удалось сохранить имя' };
  return { user: u };
}

function isAdmin(){
  return !!(currentUser && currentUser.role === 'admin');
}

function countAdmins(auth){
  var n = 0;
  auth.users.forEach(function(u){ if (u.role === 'admin') n++; });
  return n;
}

/* смена пароля другому пользователю: права администратора, текущий пароль не нужен */
function adminSetPassword(uid, newPassword){
  if (!isAdmin() && !(currentUser && currentUser.id === uid)) return { error: 'Недостаточно прав' };
  var err = validatePassword(newPassword);
  if (err) return { error: err };
  var auth = readAuth(), u = null;
  auth.users.forEach(function(x){ if (x.id === uid) u = x; });
  if (!u) return { error: 'Пользователь не найден' };
  u.salt = randomHex(16);
  u.iter = PBKDF2_ITER;
  u.hash = pbkdf2Hex(newPassword, u.salt, PBKDF2_ITER);
  u.defaultPw = false;
  u.pwChangedAt = nowISO();
  if (!writeAuth(auth)) return { error: 'Не удалось сохранить пароль' };
  return { user: u };
}

function setUserRole(uid, role){
  if (!isAdmin()) return { error: 'Недостаточно прав' };
  var auth = readAuth(), u = null;
  auth.users.forEach(function(x){ if (x.id === uid) u = x; });
  if (!u) return { error: 'Пользователь не найден' };
  var next = role === 'admin' ? 'admin' : 'user';
  if (u.role === 'admin' && next === 'user' && countAdmins(auth) < 2){
    return { error: 'В системе должен остаться хотя бы один администратор' };
  }
  u.role = next;
  if (!writeAuth(auth)) return { error: 'Не удалось сохранить роль' };
  if (currentUser && currentUser.id === uid) currentUser.role = next;
  return { user: u };
}

/* удаление чужого пользователя: сессия администратора сохраняется */
function removeUser(uid){
  if (!isAdmin()) return { error: 'Недостаточно прав' };
  if (currentUser && currentUser.id === uid) return { error: 'Нельзя удалить самого себя' };
  var auth = readAuth(), u = null;
  auth.users.forEach(function(x){ if (x.id === uid) u = x; });
  if (!u) return { error: 'Пользователь не найден' };
  auth.users = auth.users.filter(function(x){ return x.id !== uid; });
  if (!writeAuth(auth)) return { error: 'Не удалось удалить пользователя' };
  lsDel(LS_PREFIX_DATA + uid);
  lsDel(LS_PREFIX_PREFS + uid);
  return { ok: true };
}

function deleteAccount(uid){
  var auth = readAuth();
  auth.users = auth.users.filter(function(u){ return u.id !== uid; });
  writeAuth(auth);
  lsDel(LS_PREFIX_DATA + uid);
  lsDel(LS_PREFIX_PREFS + uid);
  clearSession();
}

function startSession(user, remember){
  var s = JSON.stringify({ uid: user.id, at: Date.now() });
  if (remember){
    lsSet(LS_SESSION, s);
    try { sessionStorage.removeItem(LS_SESSION); } catch (e){}
  } else {
    try { sessionStorage.setItem(LS_SESSION, s); } catch (e){}
    lsDel(LS_SESSION);
  }
}
function readSession(){
  var raw = lsGet(LS_SESSION);
  if (!raw){ try { raw = sessionStorage.getItem(LS_SESSION); } catch (e){ raw = null; } }
  if (!raw) return null;
  try { var s = JSON.parse(raw); return (s && s.uid) ? s : null; } catch (e){ return null; }
}
function clearSession(){
  lsDel(LS_SESSION);
  try { sessionStorage.removeItem(LS_SESSION); } catch (e){}
}

/* ======================= НАСТРОЙКИ ОФОРМЛЕНИЯ (у каждого пользователя свои) ======================= */
function loadPrefs(){
  prefs = defaultPrefs();
  var raw = currentUser ? lsGet(prefsKey()) : null;
  if (!raw) return;
  try {
    var d = JSON.parse(raw);
    if (!d || typeof d !== 'object') return;
    if (d.theme === 'light' || d.theme === 'dark') prefs.theme = d.theme;
    if (d.bg && typeof d.bg === 'object'){
      Object.keys(prefs.bg).forEach(function(k){ if (d.bg[k] !== undefined && d.bg[k] !== null) prefs.bg[k] = d.bg[k]; });
    }
    if (d.particles && typeof d.particles === 'object'){
      Object.keys(prefs.particles).forEach(function(k){ if (d.particles[k] !== undefined && d.particles[k] !== null) prefs.particles[k] = d.particles[k]; });
    } else if (d.snow && typeof d.snow === 'object'){
      /* миграция со старой версии: снег стал типом частиц */
      if (d.snow.enabled !== undefined) prefs.particles.enabled = !!d.snow.enabled;
      if (d.snow.intensity !== undefined) prefs.particles.intensity = clamp(parseInt(d.snow.intensity, 10) || 2, 1, 3);
    }
    if (d.click && typeof d.click === 'object'){
      Object.keys(prefs.click).forEach(function(k){ if (d.click[k] !== undefined && d.click[k] !== null) prefs.click[k] = d.click[k]; });
    }
  } catch (e){}
  if (prefs.bg.mode === 'image' && !prefs.bg.image) prefs.bg.mode = 'graphite';
}

var prefsWarned = false;
function savePrefs(){
  if (!currentUser) return;
  if (!lsSet(prefsKey(), JSON.stringify(prefs)) && !prefsWarned){
    prefsWarned = true;
    toast('Настройки не сохраняются: хранилище браузера недоступно', 4500);
  }
}

function patchPrefs(mutator){
  mutator(prefs);
  applyPrefs();
  savePrefs();
}

function applyPrefs(){
  if (!prefs) prefs = defaultPrefs();
  document.documentElement.setAttribute('data-theme', prefs.theme);
  applyBackground();
  Fx.configure(prefs.particles, prefs.click);
}

function applyBackground(){
  var bg = prefs.bg;
  var html = document.documentElement;
  var layer = $('#bgImage'), shade = $('#bgShade');
  if (!layer || !shade) return;
  layer.style.background = '';
  layer.style.backgroundImage = 'none';
  layer.style.filter = 'none';
  layer.style.transform = 'none';
  shade.style.background = 'transparent';

  var custom = bg.mode !== 'graphite';
  if (bg.mode === 'plain'){
    layer.style.background = bg.color || '#161a1d';
  } else if (bg.mode === 'gradient'){
    layer.style.background = 'linear-gradient(' + clamp(parseInt(bg.angle, 10) || 160, 0, 360) + 'deg, ' +
      (bg.gradA || '#23272b') + ', ' + (bg.gradB || '#0b0c0e') + ')';
  } else if (bg.mode === 'image' && bg.image){
    layer.style.backgroundImage = 'url("' + bg.image + '")';
    var b = clamp(parseInt(bg.blur, 10) || 0, 0, 30);
    if (b){
      layer.style.filter = 'blur(' + b + 'px)';
      layer.style.transform = 'scale(' + (1 + b / 90).toFixed(3) + ')';
    }
    shade.style.background = 'rgba(0,0,0,' + (clamp(parseInt(bg.dim, 10) || 0, 0, 90) / 100) + ')';
  } else {
    custom = false;
  }
  html.classList.toggle('has-bg', custom);
}

/* ======================= ЭФФЕКТЫ: ЧАСТИЦЫ И КЛИКИ ======================= */
var PARTICLE_COUNTS = {
  snow: [40, 85, 150],
  flakes: [24, 52, 90],
  crosses: [34, 70, 120],
  patterns: [22, 46, 80],
  leaves: [12, 26, 46]
};

var Fx = {
  canvas: null, ctx: null, parts: [], bursts: [], raf: 0, last: 0,
  on: false, ptype: 'snow', intensity: 2, pspeed: 1, pcolor: 'auto',
  ctype: 'off', ccolor: 'auto', csize: 1,
  w: 0, h: 0, speed: 1,

  init: function(){
    this.canvas = $('#snowCanvas');
    if (!this.canvas || !this.canvas.getContext) return;
    this.ctx = this.canvas.getContext('2d');
    var self = this;
    window.addEventListener('resize', debounce(function(){ self.resize(); }, 160));
    document.addEventListener('visibilitychange', function(){
      if (document.hidden) self.pause();
      else if (self.on || self.bursts.length) self.ensure();
    });
    document.addEventListener('pointerdown', function(e){
      if (e.button && e.button !== 0) return;
      self.clickAt(e.clientX, e.clientY);
    }, true);
    this.resize();
  },

  rgb: function(c){
    var dark = !prefs || prefs.theme === 'dark';
    if (!c || c === 'auto') return dark ? '255,255,255' : '34,40,46';
    var m = /^#([0-9a-f]{6})$/i.exec(String(c));
    if (!m) return dark ? '255,255,255' : '34,40,46';
    var n = parseInt(m[1], 16);
    return ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255);
  },

  configure: function(p, c){
    if (!this.ctx) return;
    p = p || {}; c = c || {};
    var was = this.on, type = this.ptype, inten = this.intensity;
    this.on = !!p.enabled;
    this.ptype = p.type || 'snow';
    this.intensity = clamp(parseInt(p.intensity, 10) || 2, 1, 3);
    this.pspeed = clamp(parseFloat(p.speed) || 1, 0.2, 3);
    this.pcolor = p.color || 'auto';
    this.ctype = c.type || 'off';
    this.ccolor = c.color || 'auto';
    this.csize = clamp(parseInt(c.size, 10) || 1, 1, 3);
    if (this.canvas) this.canvas.classList.toggle('on', this.on);
    if (!this.on){
      this.parts = [];
      if (!this.bursts.length) this.stop();
      return;
    }
    if (!was || type !== this.ptype || inten !== this.intensity) this.resize();
    this.ensure();
  },

  resize: function(){
    if (!this.ctx) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.w = window.innerWidth;
    this.h = window.innerHeight;
    this.canvas.width = Math.max(1, Math.round(this.w * dpr));
    this.canvas.height = Math.max(1, Math.round(this.h * dpr));
    this.canvas.style.width = this.w + 'px';
    this.canvas.style.height = this.h + 'px';
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.build();
  },

  build: function(){
    this.parts = [];
    if (!this.on) return;
    var counts = PARTICLE_COUNTS[this.ptype] || PARTICLE_COUNTS.snow;
    var n = counts[this.intensity - 1] || counts[1];
    for (var i = 0; i < n; i++) this.parts.push(this.spawn(true));
  },

  spawn: function(initial){
    var big = this.ptype === 'leaves';
    var r;
    if (this.ptype === 'snow') r = 0.7 + Math.random() * 1.9;
    else if (big) r = 5 + Math.random() * 7;
    else r = 2.2 + Math.random() * 3;
    return {
      x: Math.random() * this.w,
      y: initial ? Math.random() * this.h : -16 - Math.random() * 60,
      r: r,
      vy: (big ? 0.5 : 0.32) + Math.random() * (big ? 0.7 : 0.85),
      vx: -0.28 + Math.random() * 0.56,
      ph: Math.random() * Math.PI * 2,
      sp: 0.006 + Math.random() * 0.014,
      a: 0.22 + Math.random() * 0.6,
      rot: Math.random() * Math.PI * 2,
      rs: -0.02 + Math.random() * 0.04,
      kind: Math.floor(Math.random() * 4)
    };
  },

  ensure: function(){
    if (this.raf || !this.ctx) return;
    if (!this.w) this.resize();
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.speed = reduced ? 0.45 : 1;
    var self = this;
    var loop = function(){
      if (!self.raf) return;
      self.tick();
      self.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  },

  stop: function(){
    if (this.raf) cancelAnimationFrame(this.raf);
    this.raf = 0;
    if (this.ctx) this.ctx.clearRect(0, 0, this.w, this.h);
  },

  pause: function(){
    if (this.raf) cancelAnimationFrame(this.raf);
    this.raf = 0;
  },

  tick: function(){
    var ctx = this.ctx;
    if (!ctx) return;
    var dt = this.last ? Math.min(2.5, (Date.now() - this.last) / 16.7) : 1;
    this.last = Date.now();
    ctx.clearRect(0, 0, this.w, this.h);
    if (this.on) this.drawParts(dt);
    if (this.bursts.length) this.drawBursts(dt);
    if (!this.on && !this.bursts.length) this.stop();
  },

  drawParts: function(dt){
    var rgb = this.rgb(this.pcolor);
    var step = this.speed * this.pspeed * dt;
    for (var i = 0; i < this.parts.length; i++){
      var f = this.parts[i];
      f.ph += f.sp * dt;
      f.x += (f.vx + Math.sin(f.ph) * 0.34) * step;
      f.y += f.vy * step;
      f.rot += f.rs * dt;
      if (f.y > this.h + 24 || f.x < -40 || f.x > this.w + 40){
        var nf = this.spawn(false);
        for (var k in nf) if (Object.prototype.hasOwnProperty.call(nf, k)) f[k] = nf[k];
      }
      this.paint(f, rgb);
    }
  },

  paint: function(f, rgb){
    var ctx = this.ctx, r = f.r, a = f.a;
    var fill = function(alpha){ return 'rgba(' + rgb + ',' + Math.max(0, Math.min(1, alpha)).toFixed(3) + ')'; };
    ctx.save();
    ctx.translate(f.x, f.y);

    if (this.ptype === 'snow'){
      ctx.beginPath(); ctx.arc(0, 0, r * 2.1, 0, Math.PI * 2);
      ctx.fillStyle = fill(a * 0.18); ctx.fill();
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fillStyle = fill(a); ctx.fill();

    } else if (this.ptype === 'flakes'){
      ctx.rotate(f.rot);
      ctx.strokeStyle = fill(a); ctx.lineWidth = 1;
      ctx.beginPath();
      for (var i = 0; i < 6; i++){
        var ang = (Math.PI / 3) * i;
        var cx = Math.cos(ang), cy = Math.sin(ang);
        ctx.moveTo(0, 0); ctx.lineTo(cx * r * 1.7, cy * r * 1.7);
        ctx.moveTo(cx * r * 1.05, cy * r * 1.05);
        ctx.lineTo(cx * r * 1.45 - cy * r * 0.42, cy * r * 1.45 + cx * r * 0.42);
        ctx.moveTo(cx * r * 1.05, cy * r * 1.05);
        ctx.lineTo(cx * r * 1.45 + cy * r * 0.42, cy * r * 1.45 - cx * r * 0.42);
      }
      ctx.stroke();

    } else if (this.ptype === 'crosses'){
      ctx.rotate(f.rot);
      ctx.strokeStyle = fill(a); ctx.lineWidth = 1.2;
      ctx.beginPath();
      if (f.kind % 2){
        ctx.moveTo(-r, 0); ctx.lineTo(r, 0);
        ctx.moveTo(0, -r); ctx.lineTo(0, r);
      } else {
        ctx.moveTo(-r, -r); ctx.lineTo(r, r);
        ctx.moveTo(r, -r); ctx.lineTo(-r, r);
      }
      ctx.stroke();

    } else if (this.ptype === 'patterns'){
      ctx.rotate(f.rot);
      ctx.strokeStyle = fill(a); ctx.lineWidth = 1;
      ctx.beginPath();
      if (f.kind === 0){
        ctx.moveTo(0, -r); ctx.lineTo(r, 0); ctx.lineTo(0, r); ctx.lineTo(-r, 0); ctx.closePath();
        ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, Math.max(0.8, r * 0.18), 0, Math.PI * 2);
        ctx.fillStyle = fill(a); ctx.fill();
      } else if (f.kind === 1){
        for (var j = 0; j < 8; j++){
          var b = (Math.PI / 4) * j;
          ctx.moveTo(Math.cos(b) * r * 0.35, Math.sin(b) * r * 0.35);
          ctx.lineTo(Math.cos(b) * r, Math.sin(b) * r);
        }
        ctx.stroke();
      } else if (f.kind === 2){
        ctx.moveTo(0, -r); ctx.lineTo(r * 0.95, r * 0.72); ctx.lineTo(-r * 0.95, r * 0.72); ctx.closePath();
        ctx.stroke();
      } else {
        ctx.rect(-r, -r, r * 2, r * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.rect(-r * 0.45, -r * 0.45, r * 0.9, r * 0.9);
        ctx.stroke();
      }

    } else if (this.ptype === 'leaves'){
      ctx.rotate(f.rot);
      var w = r * 0.5;
      ctx.beginPath();
      ctx.moveTo(0, -r);
      ctx.bezierCurveTo(w * 1.9, -r * 0.45, w * 1.5, r * 0.72, 0, r);
      ctx.bezierCurveTo(-w * 1.5, r * 0.72, -w * 1.9, -r * 0.45, 0, -r);
      ctx.fillStyle = fill(a * 0.4); ctx.fill();
      ctx.strokeStyle = fill(a); ctx.lineWidth = 1; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.82); ctx.lineTo(0, r * 0.8);
      ctx.stroke();
    }
    ctx.restore();
  },

  /* эффекты от кликов */
  clickAt: function(x, y){
    if (this.ctype === 'off' || !this.ctx) return;
    var rgb = this.rgb(this.ccolor), size = this.csize, i, ang;

    if (this.ctype === 'wave' || this.ctype === 'ripple'){
      this.bursts.push({ kind: this.ctype, x: x, y: y, t: 0, life: 900,
        r1: (this.ctype === 'wave' ? 96 : 64) * size, rgb: rgb });
      if (this.ctype === 'wave'){
        this.bursts.push({ kind: 'wave', x: x, y: y, t: -170, life: 900, r1: 70 * size, rgb: rgb });
      }
    } else if (this.ctype === 'cross'){
      for (i = 0; i < 6; i++){
        ang = (Math.PI * 2 / 6) * i + Math.random() * 0.4;
        this.bursts.push({ kind: 'bit', shape: 'cross', x: x, y: y, t: 0, life: 620,
          vx: Math.cos(ang) * (1.3 + Math.random()) * size,
          vy: Math.sin(ang) * (1.3 + Math.random()) * size,
          r: (4.5 + Math.random() * 3.5) * size, rot: ang, rgb: rgb });
      }
    } else if (this.ctype === 'spark'){
      for (i = 0; i < 11; i++){
        ang = (Math.PI * 2 / 11) * i;
        this.bursts.push({ kind: 'bit', shape: 'dot', x: x, y: y, t: 0, life: 520,
          vx: Math.cos(ang) * (1.8 + Math.random() * 2.2) * size,
          vy: Math.sin(ang) * (1.8 + Math.random() * 2.2) * size,
          r: (1.5 + Math.random() * 2) * size, rot: 0, rgb: rgb });
      }
    }
    this.ensure();
  },

  drawBursts: function(dt){
    var ctx = this.ctx, keep = [];
    for (var i = 0; i < this.bursts.length; i++){
      var b = this.bursts[i];
      b.t += 16.7 * dt;
      if (b.t < 0){ keep.push(b); continue; }
      var p = b.t / b.life;
      if (p >= 1) continue;
      keep.push(b);

      if (b.kind === 'wave' || b.kind === 'ripple'){
        var rad = Math.max(1, b.r1 * (1 - Math.pow(1 - p, 2.2)));
        ctx.beginPath();
        ctx.arc(b.x, b.y, rad, 0, Math.PI * 2);
        if (b.kind === 'wave'){
          ctx.strokeStyle = 'rgba(' + b.rgb + ',' + (0.55 * (1 - p)).toFixed(3) + ')';
          ctx.lineWidth = Math.max(0.4, 1.7 * (1 - p * 0.6));
          ctx.stroke();
        } else {
          ctx.fillStyle = 'rgba(' + b.rgb + ',' + (0.16 * (1 - p)).toFixed(3) + ')';
          ctx.fill();
        }
        continue;
      }

      b.x += b.vx * dt; b.y += b.vy * dt;
      b.vx *= 0.965; b.vy *= 0.965;
      var alpha = 0.8 * (1 - p);
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rot);
      if (b.shape === 'cross'){
        ctx.strokeStyle = 'rgba(' + b.rgb + ',' + alpha.toFixed(3) + ')';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(-b.r, -b.r); ctx.lineTo(b.r, b.r);
        ctx.moveTo(b.r, -b.r); ctx.lineTo(-b.r, b.r);
        ctx.stroke();
      } else {
        ctx.fillStyle = 'rgba(' + b.rgb + ',' + alpha.toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(0, 0, b.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
    this.bursts = keep;
  },

  demo: function(){
    this.clickAt(Math.round(this.w / 2), Math.round(this.h * 0.4));
  }
};

/* ======================= ЭКРАН ВХОДА ======================= */
function authError(msg, fieldId){
  var box = $('#authMsg');
  if (box){ box.textContent = msg; box.classList.add('show'); }
  $$('.input').forEach(function(i){ i.classList.remove('bad'); });
  if (fieldId){ var f = $('#' + fieldId); if (f) f.classList.add('bad'); }
}

function showAuth(){
  var host = $('#authHost');
  if (!host) return;
  document.body.classList.add('auth-mode');
  ensureDefaultAccount();

  host.innerHTML =
    '<div class="auth" id="authScreen"><div class="auth-card">' +
      '<div class="auth-brand">' +
        '<div class="brand-mark" role="img" aria-label="Shokydo"></div>' +
        '<div><div class="auth-title">OmniBoard</div><div class="auth-sub">доски задач</div></div>' +
      '</div>' +
      '<div class="auth-lead">Вход в аккаунт</div>' +
      '<div class="auth-msg" id="authMsg"></div>' +
      '<form id="authForm" novalidate>' +
        '<div class="field"><label for="auLogin">Логин</label>' +
          '<input class="input" id="auLogin" type="text" value="' + esc(DEFAULT_NAME) + '" autocomplete="username" autocapitalize="none" spellcheck="false"></div>' +
        '<div class="field"><label for="auPass">Пароль</label>' +
          '<input class="input" id="auPass" type="password" placeholder="пароль" autocomplete="current-password"></div>' +
        '<label class="checkline"><input type="checkbox" id="auRemember" checked> Запомнить меня на этом устройстве</label>' +
        '<button class="btn solid auth-submit" type="submit" id="authSubmit">Войти</button>' +
      '</form>' +
      '<div class="auth-note">Вход только для аккаунтов, созданных администратором. Пароль по умолчанию — ' +
        '<b>' + esc(DEFAULT_PASSWORD) + '</b>, смените его в настройках аккаунта после входа.<br>' +
        'Данные хранятся <b>только в этом браузере</b>, пароль — в виде хеша PBKDF2-SHA256 с солью.</div>' +
    '</div></div>';

  var form = $('#authForm');
  var passInput = $('#auPass');
  var loginInput = $('#auLogin');
  setTimeout(function(){ if (passInput) passInput.focus(); }, 60);

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var login = loginInput.value.trim();
    var pass = passInput.value;
    if (!login){ return authError('Введите логин', 'auLogin'); }
    if (!pass){ return authError('Введите пароль', 'auPass'); }

    var res = loginUser(login, pass);
    if (res.error) return authError(res.error, 'auPass');

    startSession(res.user, $('#auRemember').checked);
    signIn(res.user, res.user.defaultPw
      ? 'Вход выполнен. Смените пароль по умолчанию в настройках аккаунта.'
      : 'С возвращением, ' + (res.user.name || res.user.login));
  });
}

function hideAuth(){
  var host = $('#authHost');
  if (host) host.innerHTML = '';
  document.body.classList.remove('auth-mode');
}

function signIn(user, greet){
  currentUser = { id: user.id, login: user.login, name: user.name, role: user.role === 'admin' ? 'admin' : 'user', defaultPw: !!user.defaultPw };
  hideAuth();
  enterApp();
  if (greet) toast(greet, 3000);
}

function signOut(){
  saveNow();
  clearSession();
  currentUser = null;
  closePrefs();
  $('#dialogHost').innerHTML = '';
  state = { version: 2, activeBoard: null, boards: [], tasks: {} };
  openTaskId = null;
  renderSidebar();
  renderBoard();
  loadPrefs();
  applyPrefs();
  showAuth();
}

function renderAccountChip(){
  if (!currentUser) return;
  var label = currentUser.name || currentUser.login;
  var initials = label.trim().split(/\s+/).map(function(w){ return w.charAt(0); }).join('').slice(0, 2).toUpperCase();
  var av = $('#userAvatar'), nm = $('#userName');
  if (av) av.textContent = initials || '?';
  if (nm) nm.textContent = label;
  var chip = $('#userChip');
  if (chip) chip.title = label + ' (@' + currentUser.login + ')';
}

/* ======================= МЕНЮ АККАУНТА ======================= */
function closeAccountMenu(){
  var m = $('#accountMenu');
  if (m) m.remove();
}

function toggleAccountMenu(anchor){
  if ($('#accountMenu')){ closeAccountMenu(); return; }
  var rect = anchor.getBoundingClientRect();
  var menu = document.createElement('div');
  menu.className = 'menu';
  menu.id = 'accountMenu';
  menu.innerHTML =
    '<div class="menu-head"><b>' + esc(currentUser.name || currentUser.login) + '</b>' +
      '<span>@' + esc(currentUser.login) + '</span></div>' +
    '<button data-acc="prefs">Настройки: оформление и эффекты</button>' +
    '<button data-acc="account">Аккаунт и пароль</button>' +
    '<button data-acc="export">Импорт и экспорт (JSON, Markdown)</button>' +
    '<hr>' +
    '<button data-acc="logout" class="danger">Выйти</button>';
  document.body.appendChild(menu);
  menu.style.position = 'fixed';
  menu.style.top = Math.round(rect.bottom + 8) + 'px';
  menu.style.right = Math.max(10, Math.round(window.innerWidth - rect.right)) + 'px';
  menu.addEventListener('click', function(e){
    var b = e.target.closest('[data-acc]');
    if (!b) return;
    var act = b.getAttribute('data-acc');
    closeAccountMenu();
    if (act === 'prefs') openPrefs();
    else if (act === 'account') openAccount();
    else if (act === 'export') ioDialog();
    else if (act === 'logout') signOut();
  });
}

/* ======================= НАСТРОЙКИ: ОФОРМЛЕНИЕ, ЭФФЕКТЫ, АККАУНТ, ЛЮДИ ======================= */
function fmtDate(iso){
  if (!iso) return '—';
  try {
    var d = new Date(iso);
    return ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + '.' + d.getFullYear();
  } catch (e){ return '—'; }
}

var settingsScroll = { look: 0, fx: 0, account: 0, users: 0 };

function settingsTabs(){
  var tabs = [['look', 'Оформление'], ['fx', 'Эффекты'], ['account', 'Аккаунт']];

function roleBadge(role){

    (role === 'admin' ? 'админ' : 'пользователь') + '</span>';

function segHTML(kind, options, value){
  var html = '<div class="seg">';
  options.forEach(function(o){
    html += '<button data-set-' + kind + '="' + o[0] + '" class="' + (o[0] === String(value) ? 'on' : '') + '">' + o[1] + '</button>';
  });
  return html + '</div>';
}

function isHexColor(c){ return /^#[0-9a-f]{6}$/i.test(String(c || '')); }

function colorRow(kind, color, label){
  var auto = !color || color === 'auto';
  var shown = auto ? (prefs.theme === 'dark' ? '#ffffff' : '#22282e') : color;
  return '<div class="slider-row"><label>' + label + '</label>' +
    '<input type="color" data-fxcolor="' + kind + '" value="' + esc(shown) + '">' +
    '<button class="btn sm' + (auto ? ' solid' : '') + '" data-fxauto="' + kind + '">Авто</button>' +
    '<span class="prefs-hint" style="margin:0;min-width:62px">' + (auto ? 'по теме' : esc(color)) + '</span></div>';
}

      '<div style="margin-bottom:14px"><button class="btn solid sm" data-acc-act="save-name">Сохранить имя</button></div>' +

      '<div class="prefs-row"><div class="pr-main"><div class="prefs-label">Логин</div>' +
        '<div class="prefs-hint">@' + esc(currentUser.login) + ' · создан ' + fmtDate(rec && rec.created) + '</div></div></div>' +

      '<div class="prefs-row"><div class="pr-main"><div class="prefs-label">Роль</div>' +
        '<div class="prefs-hint">' + (currentUser.role === 'admin'
          ? 'Администратор: создаёт пользователей и управляет ими'
          : 'Пользователь: свои доски и оформление') + '</div></div>' + roleBadge(currentUser.role) + '</div>' +

      '<div class="prefs-row"><div class="pr-main"><div class="prefs-label">Данные</div>' +
        '<div class="prefs-hint">' + boards + ' ' + plural(boards, ['доска', 'доски', 'досок']) + ' · ' +
        tasks + ' ' + plural(tasks, ['задача', 'задачи', 'задач']) + ' · хранятся в этом браузере</div></div></div>' +

      (rec && rec.defaultPw
        ? '<div class="prefs-row" style="border-color:var(--line-2)"><div class="pr-main">' +
            '<div class="prefs-label">Пароль по умолчанию</div>' +
            '<div class="prefs-hint">Вы входите с паролем по умолчанию — задайте свой в соседней колонке.</div></div></div>'
        : '') +
    '</div>' +

    '<div class="fx-col">' +
      '<div class="sec-title" style="margin:14px 0 8px">Смена пароля</div>' +
      '<div class="field"><label for="acCur">Текущий пароль</label>' +
        '<input class="input" id="acCur" type="password" autocomplete="current-password"></div>' +
      '<div class="field"><label for="acNew">Новый пароль</label>' +
        '<input class="input" id="acNew" type="password" autocomplete="new-password"></div>' +
      '<div class="field"><label for="acNew2">Повторите новый</label>' +
        '<input class="input" id="acNew2" type="password" autocomplete="new-password"></div>' +
      '<button class="btn solid sm" data-acc-act="save-pass">Изменить пароль</button>' +

      '<div class="sec-title" style="margin:20px 0 8px">Прочее</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn sm" data-acc-act="logout">Выйти</button>' +
        '<button class="btn sm danger" data-acc-act="reset">Сбросить данные</button>' +
      '</div>' +
